<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link rel="manifest" href="manifest.json">

<meta
    name="theme-color"
    content="#0f766e"
>

<title>Templates - HomologaSolar RT</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
    }

    header {
        background: #0f766e;
        color: white;
        padding: 18px;
    }

    header h1 {
        margin: 0;
        font-size: 21px;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
    }

    .topo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    .topo h2 {
        margin: 0;
    }

    button {
        border: none;
        border-radius: 9px;
        padding: 11px 14px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-editar {
        background: #2563eb;
        color: white;
    }

    .btn-usar {
        background: #0f766e;
        color: white;
    }

    .secao {
        margin-bottom: 28px;
    }

    .secao h3 {
        margin-bottom: 12px;
    }

    .lista-templates {
        display: grid;
        grid-template-columns: repeat(
            auto-fit,
            minmax(250px, 1fr)
        );
        gap: 14px;
    }

    .template {
        background: white;
        padding: 17px;
        border-radius: 14px;
        box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .template h4 {
        margin: 0 0 7px;
        font-size: 17px;
    }

    .template p {
        margin: 0 0 12px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.4;
    }

    .badge {
        display: inline-block;
        padding: 5px 8px;
        border-radius: 6px;
        background: #ecfdf5;
        color: #047857;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .acoes-template {
        display: flex;
        gap: 8px;
    }

    .acoes-template button {
        flex: 1;
    }

    .vazio {
        background: white;
        padding: 25px;
        border-radius: 12px;
        color: #64748b;
        text-align: center;
    }

    .carregando {
        text-align: center;
        padding: 40px;
        color: #64748b;
    }

    .erro {
        display: none;
        background: #fee2e2;
        color: #991b1b;
        padding: 14px;
        border-radius: 9px;
        margin-bottom: 15px;
    }

    .sucesso {
        display: none;
        background: #dcfce7;
        color: #166534;
        padding: 14px;
        border-radius: 9px;
        margin-bottom: 15px;
    }

    @media (max-width: 600px) {

        .topo {
            align-items: stretch;
            flex-direction: column;
        }

        .acoes-template {
            flex-direction: column;
        }

    }

</style>

</head><body><header>

    <h1>☀️ HomologaSolar RT</h1>

</header>


<div class="container">

    <div class="topo">

        <h2>📋 Templates</h2>

    </div>


    <div
        id="erro"
        class="erro"
    ></div>


    <div
        id="sucesso"
        class="sucesso"
    ></div>


    <div class="secao">

        <h3>🏠 Residenciais</h3>

        <div
            id="listaResidenciais"
            class="lista-templates"
        >

            <div class="carregando">
                Carregando templates...
            </div>

        </div>

    </div>


    <div class="secao">

        <h3>🏢 Comerciais</h3>

        <div
            id="listaComerciais"
            class="lista-templates"
        >

            <div class="carregando">
                Carregando templates...
            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let templates = [];


    /* =========================================
       INICIALIZAÇÃO
    ========================================= */

    async function iniciar() {

        try {

            const {
                data,
                error
            } =
            await supabaseClient.auth.getUser();


            if (
                error ||
                !data.user
            ) {

                window.location.href =
                    "login.html";

                return;

            }


            await carregarTemplates();

        }

        catch (erro) {

            console.error(
                "ERRO AO INICIAR TEMPLATES:",
                erro
            );

            mostrarErro(
                erro.message ||
                "Erro ao carregar a página."
            );

        }

    }


    /* =========================================
       CARREGAR SOMENTE TEMPLATES GLOBAIS
    ========================================= */

    async function carregarTemplates() {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("templates_projeto")
            .select(`
                id,
                organizacao_id,
                nome,
                categoria,
                concessionaria,
                descricao,
                configuracao,
                ativo
            `)
            .is(
                "organizacao_id",
                null
            )
            .eq(
                "ativo",
                true
            )
            .order(
                "nome",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "ERRO AO CARREGAR TEMPLATES GLOBAIS:",
                error
            );

            throw error;

        }


        templates =
            data || [];


        renderizarTemplates();

    }


    /* =========================================
       RENDERIZAR TEMPLATES
    ========================================= */

    function renderizarTemplates() {

        const residenciais =
            templates.filter(
                template =>
                    template.categoria ===
                    "residencial"
            );


        const comerciais =
            templates.filter(
                template =>
                    template.categoria ===
                    "comercial"
            );


        renderizarLista(
            residenciais,
            "listaResidenciais"
        );


        renderizarLista(
            comerciais,
            "listaComerciais"
        );

    }


    /* =========================================
       RENDERIZAR LISTA
    ========================================= */

    function renderizarLista(
        lista,
        idElemento
    ) {

        const elemento =
            document.getElementById(
                idElemento
            );


        if (
            !lista ||
            lista.length === 0
        ) {

            elemento.innerHTML = `
                <div class="vazio">
                    Nenhum template disponível.
                </div>
            `;

            return;

        }


        elemento.innerHTML = "";


        lista.forEach(
            template => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "template";


                div.innerHTML = `

                    <span class="badge">
                        MODELO PADRÃO
                    </span>

                    <h4>
                        ${escaparHtml(
                            template.nome
                        )}
                    </h4>

                    <p>
                        ${escaparHtml(
                            template.descricao ||
                            "Sem descrição."
                        )}
                    </p>

                    <p>
                        <strong>
                            Concessionária:
                        </strong>

                        ${escaparHtml(
                            template.concessionaria ||
                            ""
                        )}
                    </p>

                    <div class="acoes-template">

                        <button
                            class="btn-editar"
                            onclick="verTemplate(
                                '${template.id}'
                            )"
                        >
                            👁️ Ver template
                        </button>

                        <button
                            class="btn-usar"
                            onclick="usarTemplate(
                                '${template.id}'
                            )"
                        >
                            ✅ Usar template
                        </button>

                    </div>

                `;


                elemento.appendChild(
                    div
                );

            }
        );

    }


    /* =========================================
       VER TEMPLATE
    ========================================= */

    function verTemplate(id) {

        const template =
            templates.find(
                item =>
                    item.id === id
            );


        if (!template) {

            mostrarErro(
                "Template não encontrado."
            );

            return;

        }


        window.location.href =
            "projeto-detalhes.html" +
            "?modo=template" +
            "&template_id=" +
            encodeURIComponent(
                template.id
            );

    }


    /* =========================================
       USAR TEMPLATE
    ========================================= */

    function usarTemplate(id) {

        const template =
            templates.find(
                item =>
                    item.id === id
            );


        if (!template) {

            mostrarErro(
                "Template não encontrado."
            );

            return;

        }


        window.location.href =
            "projeto-detalhes.html" +
            "?modo=usar-template" +
            "&template_id=" +
            encodeURIComponent(
                template.id
            );

    }


    /* =========================================
       SEGURANÇA HTML
    ========================================= */

    function escaparHtml(texto) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            texto || "";


        return div.innerHTML;

    }


    /* =========================================
       MENSAGEM DE ERRO
    ========================================= */

    function mostrarErro(
        mensagem
    ) {

        const elemento =
            document.getElementById(
                "erro"
            );


        elemento.textContent =
            "ERRO: " + mensagem;


        elemento.style.display =
            "block";


        setTimeout(
            () => {

                elemento.style.display =
                    "none";

            },
            6000
        );

    }


    /* =========================================
       MENSAGEM DE SUCESSO
    ========================================= */

    function mostrarSucesso(
        mensagem
    ) {

        const elemento =
            document.getElementById(
                "sucesso"
            );


        elemento.textContent =
            mensagem;


        elemento.style.display =
            "block";


        setTimeout(
            () => {

                elemento.style.display =
                    "none";

            },
            4000
        );

    }


    /* =========================================
       INICIAR
    ========================================= */

    iniciar();

</script>


<script>

    if (
        "serviceWorker" in navigator
    ) {

        window.addEventListener(
            "load",
            function() {

                navigator.serviceWorker.register(
                    "./service-worker.js"
                );

            }
        );

    }

</script>

</body></html>
