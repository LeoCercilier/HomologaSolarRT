<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Agenda - HomologaSolar RT</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 18px 15px 40px;
    }


    /* ================================
       TOPO
    ================================= */

    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .topo h1 {
      margin: 0;
      font-size: 22px;
      color: #0f766e;
    }

    .voltar {
      text-decoration: none;
      color: #64748b;
      font-size: 14px;
    }


    /* ================================
       DIAS
    ================================= */

    .dias-container {
      background: white;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      margin-bottom: 18px;
    }

    .dias {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .dias::-webkit-scrollbar {
      display: none;
    }

    .dia {
      min-width: 64px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      border-radius: 10px;
      padding: 8px 5px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dia.selecionado {
      background: #0f766e;
      color: white;
      border-color: #0f766e;
    }

    .dia .semana {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .dia .numero {
      font-size: 20px;
      font-weight: bold;
      margin-top: 2px;
    }

    .dia .indicador {
      font-size: 9px;
      height: 10px;
      margin-top: 1px;
    }


    /* ================================
       CABEÇALHO DO DIA
    ================================= */

    .cabecalho-dia {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cabecalho-dia h2 {
      margin: 0;
      font-size: 18px;
    }

    .btn-novo {
      border: none;
      background: #0f766e;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }


    /* ================================
       COMPROMISSO
    ================================= */

    .compromisso {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 9px;
      box-shadow: 0 2px 9px rgba(0,0,0,0.05);
      border-left: 4px solid #0f766e;
    }

    .compromisso.atrasado {
      border-left-color: #dc2626;
    }

    .compromisso.finalizado {
      opacity: 0.6;
      border-left-color: #16a34a;
    }

    .compromisso.cancelado {
      opacity: 0.55;
      border-left-color: #dc2626;
    }

    .linha-principal {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    .icone {
      font-size: 21px;
      line-height: 1.2;
    }

    .hora {
      font-size: 16px;
      font-weight: bold;
      color: #0f766e;
    }

    .titulo {
      font-size: 14px;
      font-weight: bold;
      margin-top: 2px;
    }

    .cliente {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .observacao {
      font-size: 12px;
      color: #475569;
      margin-top: 7px;
    }


    /* ================================
       BOTÕES
    ================================= */

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 11px;
    }

    .acoes button {
      border: none;
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-finalizar {
      background: #dcfce7;
      color: #166534;
    }

    .btn-adiar {
      background: #fef3c7;
      color: #92400e;
    }

    .btn-cancelar {
      background: #fee2e2;
      color: #991b1b;
    }


    /* ================================
       VAZIO
    ================================= */

    .vazio {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      color: #64748b;
      box-shadow: 0 2px 9px rgba(0,0,0,0.04);
    }


    /* ================================
       MODAIS
    ================================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      padding: 18px;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.aberto {
      display: flex;
    }

    .modal-conteudo {
      background: white;
      width: 100%;
      max-width: 430px;
      border-radius: 16px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-conteudo h2 {
      margin-top: 0;
      color: #0f766e;
      font-size: 20px;
    }


    /* ================================
       FORMULÁRIO
    ================================= */

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .campo textarea {
      min-height: 75px;
      resize: vertical;
    }

    .botoes-modal {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .botoes-modal button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-salvar {
      background: #0f766e;
      color: white;
    }

    .btn-fechar {
      background: #e2e8f0;
      color: #334155;
    }

    /* ================================
   FILA DE COMPROMISSOS
================================ */

.fila-container {
  width: 100%;
  max-width: 480px;
  margin: 22px auto 0;
}

.titulo-fila {
  font-size: 17px;
  margin: 0 0 10px;
  text-align: left;
}

.fila-item {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 9px;
  box-shadow: 0 2px 9px rgba(0,0,0,0.05);
  border-left: 5px solid #16a34a;
  cursor: pointer;
  transition: transform 0.15s;
}

.fila-item:active {
  transform: scale(0.98);
}

.fila-item.atrasado {
  border-left-color: #dc2626;
}

.fila-item.proximo {
  border-left-color: #eab308;
}

.fila-item.longe {
  border-left-color: #16a34a;
}

.fila-status {
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 5px;
}

.fila-item.atrasado .fila-status {
  color: #dc2626;
}

.fila-item.proximo .fila-status {
  color: #a16207;
}

.fila-item.longe .fila-status {
  color: #15803d;
}

.fila-hora {
  font-size: 16px;
  font-weight: bold;
  color: #0f766e;
}

.fila-titulo {
  font-size: 14px;
  font-weight: bold;
  margin-top: 3px;
}

.fila-cliente {
  font-size: 12px;
  color: #64748b;
  margin-top: 4px;
}

.fila-contador {
  font-size: 12px;
  font-weight: bold;
  margin-top: 7px;
  color: #334155;
}

.fila-vazia {
  background: white;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  color: #64748b;
  font-size: 13px;
}

  </style>

</head>


<body>


<div class="container">


  <!-- ================================
       TOPO
  ================================= -->

  <div class="topo">

    <a
      href="dashboard.html"
      class="voltar"
    >
      ← Dashboard
    </a>

    <h1>
      📅 Agenda
    </h1>

  </div>


  <!-- ================================
       DIAS
  ================================= -->

  <div class="dias-container">

    <div
      class="dias"
      id="dias"
    ></div>

  </div>


  <!-- ================================
       CABEÇALHO
  ================================= -->

  <div class="cabecalho-dia">

    <h2 id="tituloDia">
      Agenda de hoje
    </h2>

    <button
      class="btn-novo"
      onclick="abrirNovoCompromisso()"
    >
      ＋ Novo
    </button>

  </div>


  <!-- ================================
       COMPROMISSOS
  ================================= -->

  <div
    id="listaCompromissos"
  ></div>


</div>

  <!-- FILA DE PRÓXIMOS COMPROMISSOS -->

<div class="fila-container">

  <h2 class="titulo-fila">
    ⏱️ Próximos compromissos
  </h2>

  <div id="filaCompromissos"></div>

</div>


<!-- ================================
     MODAL NOVO COMPROMISSO
================================= -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-conteudo">

    <h2>
      📅 Novo compromisso
    </h2>


    <div class="campo">

      <label>
        Data
      </label>

      <input
        type="date"
        id="dataCompromisso"
      >

    </div>


    <div class="campo">

      <label>
        Horário
      </label>

      <input
        type="time"
        id="horaCompromisso"
      >

    </div>


    <div class="campo">

      <label>
        Tipo de compromisso
      </label>

      <select
        id="tipoCompromisso"
      >

        <option value="Reunião com cliente">
          🤝 Reunião com cliente
        </option>

        <option value="Contato com cliente">
          📞 Contato com cliente
        </option>

        <option value="Visita técnica">
          📸 Visita técnica
        </option>

        <option value="Vistoria">
          🔍 Vistoria
        </option>

        <option value="Acompanhamento de instalação">
          🏗️ Acompanhamento de instalação
        </option>

        <option value="Comissionamento">
          ⚡ Comissionamento
        </option>

        <option value="Outro compromisso">
          📌 Outro compromisso
        </option>

      </select>

    </div>


    <div class="campo">

  <label>
    Cliente
  </label>

  <select
    id="clienteCompromisso"
    onchange="carregarProjetosDoCliente()"
  >

    <option value="">
      Selecione um cliente
    </option>

  </select>

    </div>

    <div class="campo">

  <label>
    Projeto
  </label>

  <select
    id="projetoCompromisso"
  >

    <option value="">
      Selecione primeiro o cliente
    </option>

  </select>

    </div>


    <div class="campo">

      <label>
        Observação
      </label>

      <textarea
        id="observacaoCompromisso"
        placeholder="Observações..."
      ></textarea>

    </div>


    <div class="botoes-modal">

      <button
        class="btn-fechar"
        onclick="fecharModal()"
      >
        Cancelar
      </button>

      <button
        class="btn-salvar"
        onclick="salvarCompromisso()"
      >
        Salvar
      </button>

    </div>

  </div>

</div>


<!-- ================================
     MODAL ADIAR
================================= -->

<div
  class="modal"
  id="modalAdiar"
>

  <div class="modal-conteudo">

    <h2>
      → Adiar compromisso
    </h2>


    <button
      class="btn-salvar"
      onclick="adiarParaAmanha()"
      style="
        width:100%;
        margin-bottom:12px;
        padding:12px;
        border:none;
        border-radius:9px;
        font-weight:bold;
        cursor:pointer;
      "
    >
      📅 Amanhã
    </button>


    <div class="campo">

      <label>
        Escolher outra data
      </label>

      <input
        type="date"
        id="novaData"
      >

    </div>


    <div class="botoes-modal">

      <button
        class="btn-fechar"
        onclick="fecharModalAdiar()"
      >
        Cancelar
      </button>

      <button
        class="btn-salvar"
        onclick="salvarNovaData()"
      >
        Adiar
      </button>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let dataSelecionada = new Date();

let organizacaoAtual = null;
let usuarioAtual = null;

let compromissos = [];
let clientes = [];
let projetos = [];

let compromissoAdiarId = null;


/* =================================
   DATA
================================= */

function formatarData(data) {

  const ano = data.getFullYear();

  const mes =
    String(data.getMonth() + 1)
      .padStart(2, "0");

  const dia =
    String(data.getDate())
      .padStart(2, "0");

  return `${ano}-${mes}-${dia}`;

}


/* =================================
   INICIALIZAÇÃO
================================= */

async function iniciarAgenda() {

  const {
    data: { user },
    error
  } =
    await supabaseClient.auth.getUser();

  if (error || !user) {

    window.location.href = "login.html";

    return;
  }

  usuarioAtual = user;


  /*
    Descobre a organização
    do usuário logado
  */

  const resultado =
    await supabaseClient
      .from("organizacao_membros")
      .select("organizacao_id")
      .eq("usuario_id", user.id)
      .limit(1)
      .maybeSingle();


  if (resultado.error) {

    console.error(resultado.error);

    alert(
      "Não foi possível identificar sua organização."
    );

    return;
  }


  if (!resultado.data) {

    alert(
      "Seu usuário não está vinculado a uma organização."
    );

    return;
  }


  organizacaoAtual =
    resultado.data.organizacao_id;


  await carregarClientes();

  await carregarCompromissos();

  renderizar();

}


/* =================================
   CLIENTES
================================= */

async function carregarClientes() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("clientes")
      .select(
  "id,nome,telefone"
)
      .eq(
        "organizacao_id",
        organizacaoAtual
      )
      .order(
        "nome"
      );


  if (error) {

    console.error(error);

    alert(
      "Erro ao carregar clientes."
    );

    return;
  }


  clientes =
    data || [];

}


/* =================================
   PROJETOS DO CLIENTE
================================= */

async function carregarProjetosDoCliente() {

  const clienteId =
    document
      .getElementById(
        "clienteCompromisso"
      )
      .value;


  const selectProjeto =
    document
      .getElementById(
        "projetoCompromisso"
      );


  selectProjeto.innerHTML =
    `<option value="">
      Carregando projetos...
    </option>`;


  if (!clienteId) {

    selectProjeto.innerHTML =
      `<option value="">
        Selecione primeiro o cliente
      </option>`;

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("projetos")
      .select(
        "id,nome,status"
      )
      .eq(
        "organizacao_id",
        organizacaoAtual
      )
      .eq(
        "cliente_id",
        clienteId
      )
      .order(
        "nome"
      );


  if (error) {

    console.error(error);

    selectProjeto.innerHTML =
      `<option value="">
        Erro ao carregar projetos
      </option>`;

    return;
  }


  projetos =
    data || [];


  selectProjeto.innerHTML =
    `<option value="">
      Sem projeto específico
    </option>`;


  projetos.forEach(
    projeto => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        projeto.id;

      option.textContent =
        projeto.nome;

      selectProjeto.appendChild(
        option
      );

    }
  );

}


/* =================================
   CARREGAR COMPROMISSOS
================================= */

async function carregarCompromissos() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("agenda_compromissos")
      .select(`
        id,
        organizacao_id,
        cliente_id,
        projeto_id,
        data,
        hora,
        tipo,
        observacao,
        status,
        criado_por,
        clientes(nome,telefone),
        projetos(nome)
      `)
      .eq(
        "organizacao_id",
        organizacaoAtual
      )
      .order(
        "data"
      )
      .order(
        "hora"
      );


  if (error) {

    console.error(error);

    alert(
  "Erro ao carregar a agenda:\n\n" +
  error.message
);

    compromissos = [];

    return;
  }


  compromissos =
    data || [];

}


/* =================================
   GERAR DIAS
================================= */

function gerarDias() {

  const container =
    document.getElementById(
      "dias"
    );

  container.innerHTML = "";


  const inicio =
    new Date();

  inicio.setDate(
    inicio.getDate() - 3
  );


  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const data =
      new Date(inicio);

    data.setDate(
      inicio.getDate() + i
    );


    const bloco =
      document.createElement(
        "div"
      );

    bloco.className =
      "dia";


    if (
      formatarData(data) ===
      formatarData(dataSelecionada)
    ) {

      bloco.classList.add(
        "selecionado"
      );

    }


    const temCompromisso =
      compromissos.some(
        item =>
          item.data ===
          formatarData(data)
      );


    bloco.innerHTML = `

      <div class="semana">

        ${data
          .toLocaleDateString(
            "pt-BR",
            {
              weekday: "short"
            }
          )
          .replace(".", "")
        }

      </div>

      <div class="numero">

        ${data.getDate()}

      </div>

      <div class="indicador">

        ${temCompromisso ? "●" : ""}

      </div>

    `;


    bloco.onclick =
      function() {

        dataSelecionada =
          new Date(data);

        renderizar();

      };


    container.appendChild(
      bloco
    );

  }

}


/* =================================
   RENDERIZAR
================================= */

function renderizar() {

  gerarDias();

  renderizarCompromissos();

  renderizarFila();

}


/* =================================
   MOSTRAR COMPROMISSOS
================================= */

function renderizarCompromissos() {

  const lista =
    document.getElementById(
      "listaCompromissos"
    );

  lista.innerHTML = "";


  document.getElementById(
    "tituloDia"
  ).textContent =
    `📅 ${dataTexto(
      dataSelecionada
    )}`;


  const data =
    formatarData(
      dataSelecionada
    );


  const listaDia =
    compromissos
      .filter(
        item =>
          item.data === data
      )
      .sort(
        (a, b) =>
          a.hora.localeCompare(
            b.hora
          )
      );


  if (
    listaDia.length === 0
  ) {

    lista.innerHTML = `

      <div class="vazio">

        📭<br><br>

        Nenhum compromisso
        para este dia.

      </div>

    `;

    return;
  }


  const icones = {

    "Reunião com cliente": "🤝",

    "Contato com cliente": "📞",

    "Visita técnica": "📸",

    "Vistoria": "🔍",

    "Acompanhamento de instalação": "🏗️",

    "Comissionamento": "⚡",

    "Outro compromisso": "📌"

  };


  listaDia.forEach(
    compromisso => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "compromisso";


      if (
        compromisso.status ===
        "finalizado"
      ) {

        div.classList.add(
          "finalizado"
        );

      }


      if (
        compromisso.status ===
        "cancelado"
      ) {

        div.classList.add(
          "cancelado"
        );

      }


      let botoes = "";


      if (
        compromisso.status ===
        "pendente"
      ) {

        botoes = `

          <div class="acoes">

            <button
              class="btn-finalizar"
              onclick="
                finalizarCompromisso(
                  '${compromisso.id}'
                )
              "
            >

              ✓ Finalizado

            </button>


            <button
              class="btn-adiar"
              onclick="
                abrirModalAdiar(
                  '${compromisso.id}'
                )
              "
            >

              → Adiar

            </button>


            <button
              class="btn-cancelar"
              onclick="
                cancelarCompromisso(
                  '${compromisso.id}'
                )
              "
            >

              ✕ Cancelar

            </button>

          </div>

        `;

      }


      div.innerHTML = `

        <div class="linha-principal">

          <div class="icone">

            ${
              icones[
                compromisso.tipo
              ] || "📌"
            }

          </div>


          <div>

            <div class="hora">

              ${compromisso.hora}

            </div>


            <div class="titulo">

              ${compromisso.tipo}

            </div>


            <div class="cliente">

              👤 ${
                compromisso.clientes
                  ?.nome ||
                "Cliente"
              }

            </div>


            ${
              compromisso.projetos?.nome
              ?
              `
                <div class="projeto">

                  📁 ${
                    compromisso.projetos.nome
                  }

                </div>
              `
              :
              ""
            }


            ${
              compromisso.observacao
              ?
              `
                <div class="observacao">

                  📝 ${

  /* =================================
   WHATSAPP
================================= */

function abrirWhatsApp(compromisso) {

  const cliente =
    compromisso.clientes || {};

  const telefone =
    cliente.telefone || "";

  if (!telefone) {

    alert(
      "Este cliente não possui um número de WhatsApp/telefone cadastrado."
    );

    return;
  }


  // Remove espaços, parênteses, hífens etc.
  let numero =
    telefone.replace(/\D/g, "");


  // Se o número já tiver 55, mantém.
  // Caso contrário, adiciona o código do Brasil.
  if (!numero.startsWith("55")) {

    numero =
      "55" + numero;

  }


  if (numero.length < 12) {

    alert(
      "O número de telefone cadastrado parece estar incompleto."
    );

    return;
  }


  const dataHora =
    obterDataHoraCompromisso(
      compromisso
    );


  let mensagem;


  if (
    dataHora.getTime() <
    Date.now()
  ) {

    mensagem =
      `Olá! Me perdoa o atraso, tive uns imprevistos. Podemos remarcar nosso compromisso sobre "${compromisso.tipo}"?`;

  } else {

    mensagem =
      `Olá! Sobre aquele nosso compromisso "${compromisso.tipo}", está de pé?`;

  }


  const texto =
    encodeURIComponent(
      mensagem
    );


  const url =
    `https://wa.me/${numero}?text=${texto}`;


  window.open(
    url,
    "_blank"
  );

}
/* =================================
   FILA DE COMPROMISSOS
================================= */

function obterDataHoraCompromisso(compromisso) {

  return new Date(
    compromisso.data +
    "T" +
    compromisso.hora
  );

}


function renderizarFila() {

  const container =
    document.getElementById(
      "filaCompromissos"
    );

  if (!container) return;

  container.innerHTML = "";


  const agora =
    new Date();


  const fila =
    compromissos
      .filter(
        compromisso =>
          compromisso.status === "pendente"
      )
      .map(
        compromisso => {

          const dataHora =
            obterDataHoraCompromisso(
              compromisso
            );

          const diferenca =
            dataHora.getTime() -
            agora.getTime();

          return {
            compromisso,
            dataHora,
            diferenca
          };

        }
      )
      .sort(
        (a, b) =>
          a.dataHora - b.dataHora
      );


  if (!fila.length) {

    container.innerHTML = `

      <div class="fila-vazia">

        📭 Nenhum compromisso
        pendente na fila.

      </div>

    `;

    return;
  }


  fila.forEach(
    item => {

      const compromisso =
        item.compromisso;


      const diferenca =
        item.diferenca;


      let classe =
        "longe";

      let textoStatus =
        "🟢 Longe";


      if (diferenca < 0) {

        classe =
          "atrasado";

        textoStatus =
          "🔴 Atrasado";

      }

      else if (
        diferenca <=
        24 * 60 * 60 * 1000
      ) {

        classe =
          "proximo";

        textoStatus =
          "🟡 Próximo";

      }


      const div =
        document.createElement(
          "div"
        );


      div.className =
        `fila-item ${classe}`;


      div.onclick =
        function() {

          abrirDetalhesCompromisso(
            compromisso.id
          );

        };


      div.innerHTML = `

        <div class="fila-status">

          ${textoStatus}

        </div>


        <div class="fila-hora">

          ${compromisso.hora}

        </div>


        <div class="fila-titulo">

          ${
            compromisso.tipo ||
            "Compromisso"
          }

        </div>


        <div class="fila-cliente">

          👤 ${
            compromisso.clientes?.nome ||
            "Cliente"
          }

        </div>


        <div
          class="fila-contador"
          data-compromisso-id="${compromisso.id}"
        >

          ${textoContador(diferenca)}

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );

}


function textoContador(
  diferenca
) {

  const segundos =
    Math.floor(
      Math.abs(diferenca) / 1000
    );


  const dias =
    Math.floor(
      segundos / 86400
    );

  const horas =
    Math.floor(
      (segundos % 86400) / 3600
    );

  const minutos =
    Math.floor(
      (segundos % 3600) / 60
    );

  const seg =
    segundos % 60;


  const tempo =
    `${dias}d ${String(horas).padStart(2,"0")}:${String(minutos).padStart(2,"0")}:${String(seg).padStart(2,"0")}`;


  if (diferenca < 0) {

    return `⏰ Há ${tempo}`;

  }


  return `⏳ Em ${tempo}`;

}

function dataTexto(data) {

  const hoje =
    new Date();

  const amanha =
    new Date();

  amanha.setDate(
    amanha.getDate() + 1
  );


  if (
    formatarData(data) ===
    formatarData(hoje)
  ) {

    return "Agenda de hoje";

  }


  if (
    formatarData(data) ===
    formatarData(amanha)
  ) {

    return "Agenda de amanhã";

  }


  const dias = [

    "Domingo",
    "Segunda-feira",
    "Terça-feira",
    "Quarta-feira",
    "Quinta-feira",
    "Sexta-feira",
    "Sábado"

  ];


  return "Agenda de " +
    dias[data.getDay()];

}
