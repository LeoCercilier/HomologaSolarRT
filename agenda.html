<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - HomologaSolar RT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 18px 15px 40px;
    }

    /* TOPO */
    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .topo h1 { margin: 0; font-size: 22px; color: #0f766e; }
    .voltar { text-decoration: none; color: #64748b; font-size: 14px; }

    /* DIAS */
    .dias-container {
      background: white;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      margin-bottom: 18px;
    }
    .dias {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .dias::-webkit-scrollbar { display: none; }
    .dia {
      min-width: 64px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      border-radius: 10px;
      padding: 8px 5px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .dia.selecionado {
      background: #0f766e;
      color: white;
      border-color: #0f766e;
    }
    .dia .semana { font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .dia .numero { font-size: 20px; font-weight: bold; margin-top: 2px; }
    .dia .indicador { font-size: 9px; height: 10px; margin-top: 1px; }

    /* CABEÇALHO */
    .cabecalho-dia {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cabecalho-dia h2 { margin: 0; font-size: 18px; }
    .btn-novo {
      border: none;
      background: #0f766e;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    /* COMPROMISSO */
    .compromisso {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 9px;
      box-shadow: 0 2px 9px rgba(0,0,0,0.05);
      border-left: 4px solid #0f766e;
    }
    .compromisso.atrasado { border-left-color: #dc2626; }
    .compromisso.finalizado { opacity: 0.75; border-left-color: #16a34a; }
    .compromisso.cancelado { opacity: 0.55; border-left-color: #dc2626; }
    .linha-principal { display: flex; gap: 9px; align-items: flex-start; }
    .icone { font-size: 21px; line-height: 1.2; }
    .hora { font-size: 16px; font-weight: bold; color: #0f766e; }
    .titulo { font-size: 14px; font-weight: bold; margin-top: 2px; }
    .cliente { font-size: 13px; color: #64748b; margin-top: 4px; }
    .observacao { font-size: 12px; color: #475569; margin-top: 7px; }

    /* BOTÕES */
    .acoes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }
    .acoes button {
      border: none;
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-finalizar { background: #dcfce7; color: #166534; }
    .btn-adiar { background: #fef3c7; color: #92400e; }
    .btn-cancelar { background: #fee2e2; color: #991b1b; }

    /* VAZIO */
    .vazio {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      color: #64748b;
      box-shadow: 0 2px 9px rgba(0,0,0,0.04);
    }

    /* MODAIS */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      padding: 18px;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.aberto { display: flex; }
    .modal-conteudo {
      background: white;
      width: 100%;
      max-width: 430px;
      border-radius: 16px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-conteudo h2 {
      margin-top: 0;
      color: #0f766e;
      font-size: 20px;
    }

    /* FORMULÁRIO */
    .campo { margin-bottom: 14px; }
    .campo label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .campo input, .campo select, .campo textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: white;
    }
    .campo textarea { min-height: 75px; resize: vertical; }
    .botoes-modal { display: flex; gap: 8px; margin-top: 18px; }
    .botoes-modal button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-salvar { background: #0f766e; color: white; }
    .btn-fechar { background: #e2e8f0; color: #334155; }

    /* FILA */
    .fila-container { width: 100%; max-width: 480px; margin: 22px auto 0; }
    .titulo-fila { font-size: 17px; margin: 0 0 10px; text-align: left; }
    .fila-item {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 9px;
      box-shadow: 0 2px 9px rgba(0,0,0,0.05);
      border-left: 5px solid #16a34a;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .fila-item:active { transform: scale(0.98); }
    .fila-item.atrasado { border-left-color: #dc2626; }
    .fila-item.proximo { border-left-color: #eab308; }
    .fila-item.longe { border-left-color: #16a34a; }
    .fila-status { font-size: 11px; font-weight: bold; margin-bottom: 5px; }
    .fila-item.atrasado .fila-status { color: #dc2626; }
    .fila-item.proximo .fila-status { color: #a16207; }
    .fila-item.longe .fila-status { color: #15803d; }
    .fila-hora { font-size: 16px; font-weight: bold; color: #0f766e; }
    .fila-titulo { font-size: 14px; font-weight: bold; margin-top: 3px; }
    .fila-cliente { font-size: 12px; color: #64748b; margin-top: 4px; }
    .fila-contador {
      font-size: 24px;
      font-weight: 800;
      margin-top: 10px;
      color: #0f766e;
      letter-spacing: 1px;
      line-height: 1.1;
    }
    .fila-vazia {
      background: white;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    /* ===== NOVOS ESTILOS - REGISTRO + ANEXOS ===== */
    .secao-registro {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 2px solid #e2e8f0;
    }
    .secao-registro h3 {
      margin: 0 0 14px;
      font-size: 16px;
      color: #0f766e;
    }
    .checklist-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      transition: all 0.15s;
      user-select: none;
    }
    .check-item.marcado {
      background: #ccfbf1;
      border-color: #0f766e;
      color: #0f766e;
      font-weight: 600;
    }
    .check-item input { display: none; }

    .anexos-area {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      background: #f8fafc;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .anexos-area.dragover {
      border-color: #0f766e;
      background: #f0fdfa;
    }
    .anexos-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .anexo-item {
      position: relative;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px;
      width: 90px;
      text-align: center;
      font-size: 11px;
    }
    .anexo-item img, .anexo-item video {
      width: 100%;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .anexo-item .nome {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 74px;
    }
    .anexo-remover {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: white;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      line-height: 1;
    }
    .btn-add-anexo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f766e;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .registro-salvo {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="topo">
    <a href="dashboard.html" class="voltar">← Dashboard</a>
    <h1>📅 Agenda</h1>
  </div>

  <div class="dias-container">
    <div class="dias" id="dias"></div>
  </div>

  <div class="cabecalho-dia">
    <h2 id="tituloDia">Agenda de hoje</h2>
    <button class="btn-novo" onclick="abrirNovoCompromisso()">＋ Novo</button>
  </div>

  <div id="listaCompromissos"></div>
</div>

<div class="fila-container">
  <h2 class="titulo-fila">⏱️ Próximos compromissos</h2>
  <div id="filaCompromissos"></div>
</div>

<!-- MODAL NOVO COMPROMISSO -->
<div class="modal" id="modal">
  <div class="modal-conteudo">
    <h2>📅 Novo compromisso</h2>
    <div class="campo">
      <label>Data</label>
      <input type="date" id="dataCompromisso">
    </div>
    <div class="campo">
      <label>Horário</label>
      <input type="time" id="horaCompromisso">
    </div>
    <div class="campo">
      <label>Tipo de compromisso</label>
      <select id="tipoCompromisso">
        <option value="Reunião com cliente">🤝 Reunião com cliente</option>
        <option value="Contato com cliente">📞 Contato com cliente</option>
        <option value="Visita técnica">📸 Visita técnica</option>
        <option value="Vistoria">🔍 Vistoria</option>
        <option value="Acompanhamento de instalação">🏗️ Acompanhamento de instalação</option>
        <option value="Comissionamento">⚡ Comissionamento</option>
        <option value="Outro compromisso">📌 Outro compromisso</option>
      </select>
    </div>
    <div class="campo">
      <label>Cliente</label>
      <select id="clienteCompromisso" onchange="carregarProjetosDoCliente()">
        <option value="">Selecione um cliente</option>
      </select>
    </div>
    <div class="campo">
      <label>Projeto</label>
      <select id="projetoCompromisso">
        <option value="">Selecione primeiro o cliente</option>
      </select>
    </div>
    <div class="campo">
      <label>Observação</label>
      <textarea id="observacaoCompromisso" placeholder="Observações..."></textarea>
    </div>
    <div class="campo">
      <label>📍 Endereço da tarefa</label>
      <input type="text" id="enderecoCompromisso" placeholder="Rua, número, bairro, cidade...">
    </div>
    <div class="botoes-modal">
      <button class="btn-fechar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarCompromisso()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL ADIAR -->
<div class="modal" id="modalAdiar">
  <div class="modal-conteudo">
    <h2>→ Adiar compromisso</h2>
    <button class="btn-salvar" onclick="adiarParaAmanha()" style="width:100%;margin-bottom:12px;padding:12px;border:none;border-radius:9px;font-weight:bold;cursor:pointer;">
      📅 Amanhã
    </button>
    <div class="campo">
      <label>Escolher outra data</label>
      <input type="date" id="novaData">
    </div>
    <div class="botoes-modal">
      <button class="btn-fechar" onclick="fecharModalAdiar()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarNovaData()">Adiar</button>
    </div>
  </div>
</div>

<!-- MODAL DETALHES COMPROMISSO (MELHORADO) -->
<div class="modal" id="modalDetalhesCompromisso">
  <div class="modal-conteudo">
    <h2>📅 Compromisso</h2>
    <div id="detalhesCompromisso"></div>

    <!-- SEÇÃO DE REGISTRO (aparece quando pendente) -->
    <div id="secaoRegistro" class="secao-registro" style="display:none;">
      <h3>📝 Registro da Atividade</h3>

      <div class="campo">
        <label>O que foi realizado?</label>
        <textarea id="tarefaRealizada" placeholder="Descreva brevemente o que foi feito..."></textarea>
      </div>

      <div class="campo">
        <label>Checklist</label>
        <div class="checklist-grid" id="checklistContainer"></div>
      </div>

      <div class="campo">
        <label>Observações adicionais</label>
        <textarea id="obsAdicionais" placeholder="Anotações extras..."></textarea>
      </div>

      <div class="campo">
        <label>Anexos (foto, vídeo, PDF...)</label>
        <div class="anexos-area" id="dropzoneAnexos">
          <div>📎 Arraste arquivos aqui ou</div>
          <button type="button" class="btn-add-anexo" onclick="document.getElementById('inputAnexos').click()">
            + Adicionar arquivo
          </button>
          <input type="file" id="inputAnexos" multiple accept="image/*,video/*,application/pdf,audio/*" style="display:none;" onchange="adicionarArquivos(this.files)">
        </div>
        <div class="anexos-lista" id="listaAnexosPreview"></div>
      </div>

      <button class="btn-salvar" style="width:100%;margin-top:10px;" onclick="salvarRegistroEFinalizar()">
        ✅ Salvar registro e Finalizar
      </button>
    </div>

    <!-- REGISTRO JÁ SALVO (quando finalizado) -->
    <div id="registroSalvo" style="display:none;"></div>

    <div class="botoes-modal" style="margin-top:16px;">
      <button class="btn-fechar" onclick="fecharDetalhesCompromisso()">Fechar</button>
      <button class="btn-salvar" id="btnWhatsApp">💬 WhatsApp</button>
    </div>
    <button id="btnVerProjeto" class="btn-salvar" style="width:100%;margin-top:8px;display:none;">
      📁 Ver projeto
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let dataSelecionada = new Date();
let organizacaoAtual = null;
let usuarioAtual = null;
let compromissos = [];
let clientes = [];
let projetos = [];
let compromissoAdiarId = null;
let compromissoAtualId = null;
let arquivosParaUpload = []; // arquivos temporários no preview

// ========== CHECKLIST DINÂMICO ==========
const CHECKLISTS = {
  "Visita técnica": [
    "Fotos do local tiradas",
    "Medições realizadas",
    "Orientação ao cliente",
    "Documentos coletados",
    "Próximo passo definido"
  ],
  "Vistoria": [
    "Checklist de conformidade",
    "Fotos evidências",
    "Não conformidades registradas",
    "Relatório elaborado",
    "Cliente ciente"
  ],
  "Comissionamento": [
    "Sistema energizado",
    "Testes de geração ok",
    "Configuração inversor",
    "App/monitoramento configurado",
    "Cliente treinado"
  ],
  "Acompanhamento de instalação": [
    "Progresso verificado",
    "Fotos da obra",
    "Pendências anotadas",
    "Prazo atualizado",
    "Comunicação com instalador"
  ],
  "Reunião com cliente": [
    "Proposta apresentada",
    "Dúvidas esclarecidas",
    "Próximos passos definidos",
    "Documentos entregues"
  ],
  "Contato com cliente": [
    "Cliente contatado",
    "Informações atualizadas",
    "Retorno agendado"
  ],
  "Outro compromisso": [
    "Tarefa concluída",
    "Registros feitos",
    "Próximo passo definido"
  ]
};

function formatarData(data) {
  const ano = data.getFullYear();
  const mes = String(data.getMonth() + 1).padStart(2, "0");
  const dia = String(data.getDate()).padStart(2, "0");
  return `${ano}-${mes}-${dia}`;
}

async function iniciarAgenda() {
  const { data: { user }, error } = await supabaseClient.auth.getUser();
  if (error || !user) {
    window.location.href = "login.html";
    return;
  }
  usuarioAtual = user;

  const resultado = await supabaseClient
    .from("organizacao_membros")
    .select("organizacao_id")
    .eq("usuario_id", user.id)
    .limit(1)
    .maybeSingle();

  if (resultado.error || !resultado.data) {
    alert("Não foi possível identificar sua organização.");
    return;
  }
  organizacaoAtual = resultado.data.organizacao_id;

  await carregarClientes();
  await carregarCompromissos();
  renderizar();
  abrirCompromissoDaUrl();
}

async function carregarClientes() {
  const { data, error } = await supabaseClient
    .from("clientes")
    .select("id,nome,telefone")
    .eq("organizacao_id", organizacaoAtual)
    .order("nome");
  if (error) {
    console.error(error);
    return;
  }
  clientes = data || [];
}

async function carregarProjetosDoCliente() {
  const clienteId = document.getElementById("clienteCompromisso").value;
  const selectProjeto = document.getElementById("projetoCompromisso");
  selectProjeto.innerHTML = `<option value="">Carregando projetos...</option>`;

  if (!clienteId) {
    selectProjeto.innerHTML = `<option value="">Selecione primeiro o cliente</option>`;
    return;
  }

  const { data, error } = await supabaseClient
    .from("projetos")
    .select("id,nome,status")
    .eq("organizacao_id", organizacaoAtual)
    .eq("cliente_id", clienteId)
    .order("nome");

  if (error) {
    selectProjeto.innerHTML = `<option value="">Erro ao carregar</option>`;
    return;
  }
  projetos = data || [];
  selectProjeto.innerHTML = `<option value="">Sem projeto específico</option>`;
  projetos.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.nome;
    selectProjeto.appendChild(opt);
  });
}

async function carregarCompromissos() {
  const { data, error } = await supabaseClient
    .from("agenda_compromissos")
    .select(`
      id, organizacao_id, cliente_id, projeto_id, data, hora, tipo,
      observacao, endereco, status, criado_por,
      tarefa_realizada, checklist, anexos,
      clientes(nome,telefone), projetos(nome)
    `)
    .eq("organizacao_id", organizacaoAtual)
    .order("data")
    .order("hora");

  if (error) {
    console.error(error);
    alert("Erro ao carregar a agenda:\n\n" + error.message);
    compromissos = [];
    return;
  }
  compromissos = data || [];
}

function gerarDias() {
  const container = document.getElementById("dias");
  container.innerHTML = "";
  const inicio = new Date();
  inicio.setDate(inicio.getDate() - 3);

  for (let i = 0; i < 14; i++) {
    const data = new Date(inicio);
    data.setDate(inicio.getDate() + i);
    const bloco = document.createElement("div");
    bloco.className = "dia";
    if (formatarData(data) === formatarData(dataSelecionada)) {
      bloco.classList.add("selecionado");
    }
    const tem = compromissos.some(item => item.data === formatarData(data));
    bloco.innerHTML = `
      <div class="semana">${data.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","")}</div>
      <div class="numero">${data.getDate()}</div>
      <div class="indicador">${tem ? "●" : ""}</div>
    `;
    bloco.onclick = () => {
      dataSelecionada = new Date(data);
      renderizar();
    };
    container.appendChild(bloco);
  }
}

function renderizar() {
  gerarDias();
  renderizarCompromissos();
  renderizarFila();
}

function renderizarCompromissos() {
  const lista = document.getElementById("listaCompromissos");
  lista.innerHTML = "";
  document.getElementById("tituloDia").textContent = `📅 ${dataTexto(dataSelecionada)}`;

  const data = formatarData(dataSelecionada);
  const listaDia = compromissos
    .filter(item => item.data === data)
    .sort((a, b) => a.hora.localeCompare(b.hora));

  if (listaDia.length === 0) {
    lista.innerHTML = `<div class="vazio">📭<br><br>Nenhum compromisso para este dia.</div>`;
    return;
  }

  const icones = {
    "Reunião com cliente": "🤝",
    "Contato com cliente": "📞",
    "Visita técnica": "📸",
    "Vistoria": "🔍",
    "Acompanhamento de instalação": "🏗️",
    "Comissionamento": "⚡",
    "Outro compromisso": "📌"
  };

  listaDia.forEach(compromisso => {
    const div = document.createElement("div");
    div.className = "compromisso";
    if (compromisso.status === "finalizado") div.classList.add("finalizado");
    if (compromisso.status === "cancelado") div.classList.add("cancelado");

    let botoes = "";
    if (compromisso.status === "pendente") {
      botoes = `
        <div class="acoes">
          <button class="btn-finalizar" onclick="abrirParaFinalizar('${compromisso.id}')">✓ Finalizado</button>
          <button class="btn-adiar" onclick="abrirModalAdiar('${compromisso.id}')">→ Adiar</button>
          <button class="btn-cancelar" onclick="cancelarCompromisso('${compromisso.id}')">✕ Cancelar</button>
        </div>
      `;
    }

    div.innerHTML = `
      <div class="linha-principal" onclick="abrirDetalhesCompromisso('${compromisso.id}')" style="cursor:pointer;">
        <div class="icone">${icones[compromisso.tipo] || "📌"}</div>
        <div>
          <div class="hora">${compromisso.hora}</div>
          <div class="titulo">${compromisso.tipo}</div>
          <div class="cliente">👤 ${compromisso.clientes?.nome || "Cliente"}</div>
          ${compromisso.projetos?.nome ? `<div class="projeto">📁 ${compromisso.projetos.nome}</div>` : ""}
          ${compromisso.observacao ? `<div class="observacao">📝 ${compromisso.observacao}</div>` : ""}
        </div>
      </div>
      ${compromisso.status === "finalizado" ? `<div class="observacao">✅ Finalizado</div>` : ""}
      ${compromisso.status === "cancelado" ? `<div class="observacao">❌ Cancelado</div>` : ""}
      ${botoes}
    `;
    lista.appendChild(div);
  });
}

// ========== DETALHES + REGISTRO ==========
function abrirParaFinalizar(id) {
  abrirDetalhesCompromisso(id, true); // true = focar no registro
}

function abrirDetalhesCompromisso(id, focarRegistro = false) {
  const compromisso = compromissos.find(item => item.id === id);
  if (!compromisso) return;

  compromissoAtualId = id;
  arquivosParaUpload = [];

  const cliente = compromisso.clientes?.nome || "Cliente";
  const projeto = compromisso.projetos?.nome || "Sem projeto específico";
  const dataFormatada = compromisso.data.split("-").reverse().join("/");

  let html = `
    <div class="observacao">📅 <strong>Data:</strong> ${dataFormatada}</div>
    <div class="observacao">⏰ <strong>Horário:</strong> ${compromisso.hora}</div>
    <div class="observacao">📌 <strong>Compromisso:</strong> ${compromisso.tipo}</div>
    <div class="observacao">👤 <strong>Cliente:</strong> ${cliente}</div>
    <div class="observacao">📁 <strong>Projeto:</strong> ${projeto}</div>
  `;

  if (compromisso.endereco) {
    html += `
      <div class="observacao">📍 <strong>Endereço:</strong><br>${compromisso.endereco}</div>
      <button class="btn-salvar" style="width:100%;margin-top:10px;" onclick="navegarParaEndereco('${compromisso.id}')">
        🗺️ Iniciar navegação
      </button>
    `;
  }

  if (compromisso.observacao) {
    html += `<div class="observacao">📝 <strong>Observação:</strong><br>${compromisso.observacao}</div>`;
  }

  document.getElementById("detalhesCompromisso").innerHTML = html;

  // WhatsApp
  document.getElementById("btnWhatsApp").onclick = () => abrirWhatsApp(compromisso);

  // Ver projeto
  const btnProjeto = document.getElementById("btnVerProjeto");
  if (compromisso.projeto_id) {
    btnProjeto.style.display = "block";
    btnProjeto.onclick = () => window.location.href = `projeto-detalhes.html?id=${compromisso.projeto_id}`;
  } else {
    btnProjeto.style.display = "none";
  }

  // Seção de registro
  const secaoRegistro = document.getElementById("secaoRegistro");
  const registroSalvo = document.getElementById("registroSalvo");

  if (compromisso.status === "pendente") {
    secaoRegistro.style.display = "block";
    registroSalvo.style.display = "none";

    // Limpa campos
    document.getElementById("tarefaRealizada").value = "";
    document.getElementById("obsAdicionais").value = "";
    document.getElementById("listaAnexosPreview").innerHTML = "";

    // Checklist dinâmico
    renderizarChecklist(compromisso.tipo);

    if (focarRegistro) {
      setTimeout(() => {
        secaoRegistro.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 300);
    }
  } else {
    // Já finalizado → mostra o registro salvo
    secaoRegistro.style.display = "none";
    registroSalvo.style.display = "block";

    let htmlSalvo = `<div class="registro-salvo"><strong>✅ Registro da atividade</strong><br><br>`;
    if (compromisso.tarefa_realizada) {
      htmlSalvo += `<strong>O que foi feito:</strong><br>${compromisso.tarefa_realizada}<br><br>`;
    }
    if (compromisso.checklist && compromisso.checklist.length) {
      htmlSalvo += `<strong>Checklist:</strong><br>${compromisso.checklist.map(i => `✓ ${i}`).join("<br>")}<br><br>`;
    }
    if (compromisso.anexos && compromisso.anexos.length) {
      htmlSalvo += `<strong>Anexos:</strong><br><div class="anexos-lista">`;
      compromisso.anexos.forEach(a => {
        if (a.tipo?.startsWith("image/")) {
          htmlSalvo += `<div class="anexo-item"><img src="${a.url}" alt="${a.nome}"><div class="nome">${a.nome}</div></div>`;
        } else {
          htmlSalvo += `<div class="anexo-item"><div style="font-size:28px;margin-bottom:4px;">📄</div><div class="nome"><a href="${a.url}" target="_blank">${a.nome}</a></div></div>`;
        }
      });
      htmlSalvo += `</div>`;
    }
    htmlSalvo += `</div>`;
    registroSalvo.innerHTML = htmlSalvo;
  }

  document.getElementById("modalDetalhesCompromisso").classList.add("aberto");
}

function renderizarChecklist(tipo) {
  const container = document.getElementById("checklistContainer");
  const itens = CHECKLISTS[tipo] || CHECKLISTS["Outro compromisso"];
  container.innerHTML = "";

  itens.forEach((texto, idx) => {
    const div = document.createElement("div");
    div.className = "check-item";
    div.innerHTML = `
      <input type="checkbox" id="check_${idx}" value="${texto}">
      <label for="check_${idx}" style="cursor:pointer;margin:0;">${texto}</label>
    `;
    div.onclick = function(e) {
      if (e.target.tagName === "INPUT") return;
      const cb = div.querySelector("input");
      cb.checked = !cb.checked;
      div.classList.toggle("marcado", cb.checked);
    };
    container.appendChild(div);
  });
}

function adicionarArquivos(files) {
  Array.from(files).forEach(file => {
    arquivosParaUpload.push(file);
    const preview = document.createElement("div");
    preview.className = "anexo-item";
    preview.dataset.nome = file.name;

    if (file.type.startsWith("image/")) {
      const url = URL.createObjectURL(file);
      preview.innerHTML = `
        <img src="${url}" alt="${file.name}">
        <div class="nome">${file.name}</div>
        <button class="anexo-remover" onclick="removerPreview(this, '${file.name}')">×</button>
      `;
    } else {
      preview.innerHTML = `
        <div style="font-size:28px;margin-bottom:4px;">${file.type.includes("pdf") ? "📄" : "📎"}</div>
        <div class="nome">${file.name}</div>
        <button class="anexo-remover" onclick="removerPreview(this, '${file.name}')">×</button>
      `;
    }
    document.getElementById("listaAnexosPreview").appendChild(preview);
  });
  document.getElementById("inputAnexos").value = "";
}

function removerPreview(btn, nome) {
  arquivosParaUpload = arquivosParaUpload.filter(f => f.name !== nome);
  btn.closest(".anexo-item").remove();
}

// Drag & drop
const dropzone = document.getElementById("dropzoneAnexos");
if (dropzone) {
  dropzone.addEventListener("dragover", e => {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
  dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    adicionarArquivos(e.dataTransfer.files);
  });
}

async function uploadAnexos(files, compromissoId) {
  if (!files.length) return [];

  const resultados = [];
  for (const file of files) {
    const timestamp = Date.now();
    const nomeLimpo = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `${organizacaoAtual}/${compromissoId}/${timestamp}-${nomeLimpo}`;

    const { error } = await supabaseClient.storage
      .from("anexos-agenda")
      .upload(path, file, {
        contentType: file.type,
        cacheControl: "3600",
        upsert: false
      });

    if (error) {
      console.error("Erro upload:", error);
      alert("Erro ao enviar arquivo: " + file.name + "\n" + error.message);
      continue;
    }

    const { data: urlData } = supabaseClient.storage
      .from("anexos-agenda")
      .getPublicUrl(path);

    resultados.push({
      nome: file.name,
      path,
      url: urlData.publicUrl,
      tipo: file.type,
      tamanho: file.size,
      uploaded_at: new Date().toISOString()
    });
  }
  return resultados;
}

async function salvarRegistroEFinalizar() {
  if (!compromissoAtualId) return;

  const tarefa = document.getElementById("tarefaRealizada").value.trim();
  const obs = document.getElementById("obsAdicionais").value.trim();

  // Checklist marcado
  const checks = [];
  document.querySelectorAll("#checklistContainer input:checked").forEach(cb => {
    checks.push(cb.value);
  });

  // Upload dos anexos
  let anexosNovos = [];
  if (arquivosParaUpload.length > 0) {
    const btn = document.querySelector("#secaoRegistro .btn-salvar");
    btn.textContent = "Enviando arquivos...";
    btn.disabled = true;
    anexosNovos = await uploadAnexos(arquivosParaUpload, compromissoAtualId);
    btn.textContent = "✅ Salvar registro e Finalizar";
    btn.disabled = false;
  }

  const { error } = await supabaseClient
    .from("agenda_compromissos")
    .update({
      status: "finalizado",
      tarefa_realizada: tarefa || null,
      checklist: checks,
      anexos: anexosNovos,
      atualizado_em: new Date().toISOString()
    })
    .eq("id", compromissoAtualId)
    .eq("organizacao_id", organizacaoAtual);

  if (error) {
    console.error(error);
    alert("Erro ao salvar registro:\n" + error.message);
    return;
  }

  fecharDetalhesCompromisso();
  await carregarCompromissos();
  renderizar();
  alert("✅ Compromisso finalizado com sucesso!");
}

function fecharDetalhesCompromisso() {
  document.getElementById("modalDetalhesCompromisso").classList.remove("aberto");
  compromissoAtualId = null;
  arquivosParaUpload = [];
}

function navegarParaEndereco(id) {
  const compromisso = compromissos.find(item => item.id === id);
  if (!compromisso?.endereco) {
    alert("Este compromisso não possui endereço cadastrado.");
    return;
  }
  const destino = encodeURIComponent(compromisso.endereco);
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${destino}`, "_blank");
}

function abrirCompromissoDaUrl() {
  const params = new URLSearchParams(window.location.search);
  const compromissoId = params.get("compromisso");
  if (!compromissoId) return;
  const compromisso = compromissos.find(item => item.id === compromissoId);
  if (compromisso) abrirDetalhesCompromisso(compromissoId);
}

function abrirWhatsApp(compromisso) {
  const telefone = compromisso.clientes?.telefone || "";
  if (!telefone) {
    alert("Este cliente não possui telefone cadastrado.");
    return;
  }
  let numero = telefone.replace(/\D/g, "");
  if (!numero.startsWith("55")) numero = "55" + numero;
  if (numero.length < 12) {
    alert("Número de telefone incompleto.");
    return;
  }
  const dataHora = obterDataHoraCompromisso(compromisso);
  let mensagem = dataHora.getTime() < Date.now()
    ? `Olá! Me perdoa o atraso, tive uns imprevistos. Podemos remarcar nosso compromisso sobre "${compromisso.tipo}"?`
    : `Olá! Sobre aquele nosso compromisso "${compromisso.tipo}", está de pé?`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`, "_blank");
}

function obterDataHoraCompromisso(compromisso) {
  return new Date(compromisso.data + "T" + compromisso.hora);
}

function renderizarFila() {
  const container = document.getElementById("filaCompromissos");
  if (!container) return;
  container.innerHTML = "";

  const agora = new Date();
  const fila = compromissos
    .filter(c => c.status === "pendente")
    .map(c => {
      const dataHora = obterDataHoraCompromisso(c);
      return { compromisso: c, dataHora, diferenca: dataHora.getTime() - agora.getTime() };
    })
    .sort((a, b) => a.dataHora - b.dataHora);

  if (!fila.length) {
    container.innerHTML = `<div class="fila-vazia">📭 Nenhum compromisso pendente na fila.</div>`;
    return;
  }

  fila.forEach(item => {
    const { compromisso, diferenca } = item;
    let classe = "longe";
    let textoStatus = "🟢 Longe";
    if (diferenca < 0) { classe = "atrasado"; textoStatus = "🔴 Atrasado"; }
    else if (diferenca <= 24 * 60 * 60 * 1000) { classe = "proximo"; textoStatus = "🟡 Próximo"; }

    const div = document.createElement("div");
    div.className = `fila-item ${classe}`;
    div.onclick = () => abrirDetalhesCompromisso(compromisso.id);
    div.innerHTML = `
      <div class="fila-status">${textoStatus}</div>
      <div class="fila-hora">${compromisso.hora}</div>
      <div class="fila-titulo">${compromisso.tipo || "Compromisso"}</div>
      <div class="fila-cliente">👤 ${compromisso.clientes?.nome || "Cliente"}</div>
      <div class="fila-contador" data-compromisso-id="${compromisso.id}">${textoContador(diferenca)}</div>
    `;
    container.appendChild(div);
  });
}

function textoContador(diferenca) {
  const segundos = Math.floor(Math.abs(diferenca) / 1000);
  const dias = Math.floor(segundos / 86400);
  const horas = Math.floor((segundos % 86400) / 3600);
  const minutos = Math.floor((segundos % 3600) / 60);
  const seg = segundos % 60;
  const tempo = `${dias}d ${String(horas).padStart(2,"0")}:${String(minutos).padStart(2,"0")}:${String(seg).padStart(2,"0")}`;
  return diferenca < 0 ? `⏰ Há ${tempo}` : `⏳ Em ${tempo}`;
}

setInterval(() => {
  const agora = new Date();
  compromissos.filter(c => c.status === "pendente").forEach(c => {
    const el = document.querySelector(`[data-compromisso-id="${c.id}"]`);
    if (!el) return;
    const dif = obterDataHoraCompromisso(c).getTime() - agora.getTime();
    el.textContent = textoContador(dif);
  });
}, 1000);

function abrirNovoCompromisso() {
  document.getElementById("dataCompromisso").value = formatarData(dataSelecionada);
  document.getElementById("horaCompromisso").value = "";
  document.getElementById("observacaoCompromisso").value = "";
  document.getElementById("enderecoCompromisso").value = "";

  const selectCliente = document.getElementById("clienteCompromisso");
  selectCliente.innerHTML = `<option value="">Selecione um cliente</option>`;
  clientes.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.nome;
    selectCliente.appendChild(opt);
  });
  document.getElementById("projetoCompromisso").innerHTML = `<option value="">Selecione primeiro o cliente</option>`;
  document.getElementById("modal").classList.add("aberto");
}

function fecharModal() {
  document.getElementById("modal").classList.remove("aberto");
}

async function salvarCompromisso() {
  const data = document.getElementById("dataCompromisso").value;
  const hora = document.getElementById("horaCompromisso").value;
  const tipo = document.getElementById("tipoCompromisso").value;
  const cliente_id = document.getElementById("clienteCompromisso").value;
  const projeto_id = document.getElementById("projetoCompromisso").value || null;
  const observacao = document.getElementById("observacaoCompromisso").value.trim();
  const endereco = document.getElementById("enderecoCompromisso").value.trim();

  if (!data || !hora || !cliente_id) {
    alert("Informe data, horário e cliente.");
    return;
  }

  const { error } = await supabaseClient
    .from("agenda_compromissos")
    .insert({
      organizacao_id: organizacaoAtual,
      cliente_id,
      projeto_id,
      data,
      hora,
      tipo,
      observacao: observacao || null,
      endereco: endereco || null,
      status: "pendente",
      criado_por: usuarioAtual.id
    });

  if (error) {
    console.error(error);
    alert("Erro ao salvar compromisso:\n\n" + error.message);
    return;
  }

  fecharModal();
  await carregarCompromissos();
  dataSelecionada = new Date(data + "T00:00:00");
  renderizar();
}

async function cancelarCompromisso(id) {
  if (!confirm("Deseja cancelar este compromisso?")) return;
  const { error } = await supabaseClient
    .from("agenda_compromissos")
    .update({ status: "cancelado", atualizado_em: new Date().toISOString() })
    .eq("id", id)
    .eq("organizacao_id", organizacaoAtual);
  if (error) {
    alert("Erro ao cancelar.");
    return;
  }
  await carregarCompromissos();
  renderizar();
}

function abrirModalAdiar(id) {
  compromissoAdiarId = id;
  const compromisso = compromissos.find(item => item.id === id);
  if (!compromisso) return;
  document.getElementById("novaData").value = compromisso.data;
  document.getElementById("modalAdiar").classList.add("aberto");
}

function fecharModalAdiar() {
  document.getElementById("modalAdiar").classList.remove("aberto");
  compromissoAdiarId = null;
}

function adiarParaAmanha() {
  const novaData = new Date();
  novaData.setDate(novaData.getDate() + 1);
  salvarNovaData(formatarData(novaData));
}

async function salvarNovaData(dataForcada = null) {
  if (!compromissoAdiarId) return;
  const novaData = dataForcada || document.getElementById("novaData").value;
  if (!novaData) {
    alert("Escolha uma data.");
    return;
  }
  const { error } = await supabaseClient
    .from("agenda_compromissos")
    .update({ data: novaData, status: "pendente", atualizado_em: new Date().toISOString() })
    .eq("id", compromissoAdiarId)
    .eq("organizacao_id", organizacaoAtual);
  if (error) {
    alert("Erro ao adiar compromisso.");
    return;
  }
  fecharModalAdiar();
  dataSelecionada = new Date(novaData + "T00:00:00");
  await carregarCompromissos();
  renderizar();
}

function dataTexto(data) {
  const hoje = new Date();
  const amanha = new Date();
  amanha.setDate(amanha.getDate() + 1);
  if (formatarData(data) === formatarData(hoje)) return "Agenda de hoje";
  if (formatarData(data) === formatarData(amanha)) return "Agenda de amanhã";
  const dias = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  return "Agenda de " + dias[data.getDay()];
}
