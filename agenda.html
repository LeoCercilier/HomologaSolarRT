<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Agenda - HomologaSolar RT</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 16px 40px;
    }


    /* =================================
       CABEÇALHO
    ================================= */

    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .topo h1 {
      margin: 0;
      font-size: 22px;
      color: #0f766e;
    }

    .voltar {
      text-decoration: none;
      color: #64748b;
      font-size: 14px;
    }


    /* =================================
       BARRA DE DIAS
    ================================= */

    .dias-container {
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 18px;
    }

    .dias {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .dias::-webkit-scrollbar {
      display: none;
    }

    .dia {
      min-width: 68px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 11px;
      padding: 9px 5px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dia:hover {
      border-color: #0f766e;
    }

    .dia.selecionado {
      background: #0f766e;
      color: white;
      border-color: #0f766e;
    }

    .dia .semana {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .dia .numero {
      font-size: 22px;
      font-weight: bold;
      margin-top: 3px;
    }

    .dia .indicador {
      font-size: 10px;
      margin-top: 2px;
      min-height: 12px;
    }


    /* =================================
       CABEÇALHO DO DIA
    ================================= */

    .cabecalho-dia {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .cabecalho-dia h2 {
      margin: 0;
      font-size: 18px;
    }

    .btn-novo {
      border: none;
      background: #0f766e;
      color: white;
      padding: 10px 13px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }


    /* =================================
       COMPROMISSO
    ================================= */

    .compromisso {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      border-left: 5px solid #0f766e;
    }

    .compromisso.finalizado {
      opacity: 0.65;
      border-left-color: #16a34a;
    }

    .compromisso.cancelado {
      opacity: 0.55;
      border-left-color: #dc2626;
    }

    .linha-principal {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .icone {
      font-size: 22px;
    }

    .hora {
      font-size: 17px;
      font-weight: bold;
      color: #0f766e;
    }

    .titulo {
      font-weight: bold;
      margin-top: 2px;
    }

    .cliente {
      font-size: 14px;
      color: #64748b;
      margin-top: 5px;
    }

    .observacao {
      font-size: 13px;
      color: #475569;
      margin-top: 8px;
    }


    /* =================================
       BOTÕES DO COMPROMISSO
    ================================= */

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 13px;
    }

    .acoes button {
      border: none;
      border-radius: 7px;
      padding: 8px 9px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-finalizar {
      background: #dcfce7;
      color: #166534;
    }

    .btn-adiar {
      background: #fef3c7;
      color: #92400e;
    }

    .btn-cancelar {
      background: #fee2e2;
      color: #991b1b;
    }


    /* =================================
       MODAL
    ================================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.aberto {
      display: flex;
    }

    .modal-conteudo {
      background: white;
      width: 100%;
      max-width: 430px;
      border-radius: 16px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-conteudo h2 {
      margin-top: 0;
      color: #0f766e;
    }


    /* =================================
       FORMULÁRIO
    ================================= */

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .campo textarea {
      min-height: 80px;
      resize: vertical;
    }

    .botoes-modal {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .botoes-modal button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-salvar {
      background: #0f766e;
      color: white;
    }

    .btn-fechar {
      background: #e2e8f0;
      color: #334155;
    }


    /* =================================
       SEM COMPROMISSOS
    ================================= */

    .vazio {
      background: white;
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      color: #64748b;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- =================================
       TOPO
  ================================= -->

  <div class="topo">

    <a
      href="dashboard.html"
      class="voltar"
    >
      ← Dashboard
    </a>

    <h1>📅 Agenda</h1>

  </div>


  <!-- =================================
       DIAS
  ================================= -->

  <div class="dias-container">

    <div
      class="dias"
      id="dias"
    ></div>

  </div>


  <!-- =================================
       CABEÇALHO DO DIA
  ================================= -->

  <div class="cabecalho-dia">

    <h2 id="tituloDia">
      Agenda de hoje
    </h2>

    <button
      class="btn-novo"
      onclick="abrirNovoCompromisso()"
    >
      ＋ Novo
    </button>

  </div>


  <!-- =================================
       LISTA
  ================================= -->

  <div id="listaCompromissos"></div>


</div>


<!-- =================================
     MODAL NOVO COMPROMISSO
================================= -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-conteudo">

    <h2>📅 Novo compromisso</h2>


    <div class="campo">

      <label>
        Data
      </label>

      <input
        type="date"
        id="dataCompromisso"
      >

    </div>


    <div class="campo">

      <label>
        Horário
      </label>

      <input
        type="time"
        id="horaCompromisso"
      >

    </div>


    <div class="campo">

      <label>
        Tipo de compromisso
      </label>

      <select id="tipoCompromisso">

        <option value="Reunião com cliente">
          🤝 Reunião com cliente
        </option>

        <option value="Contato com cliente">
          📞 Contato com cliente
        </option>

        <option value="Visita técnica">
          📸 Visita técnica
        </option>

        <option value="Vistoria">
          🔍 Vistoria
        </option>

        <option value="Acompanhamento de instalação">
          🏗️ Acompanhamento de instalação
        </option>

        <option value="Comissionamento">
          ⚡ Comissionamento
        </option>

        <option value="Outro compromisso">
          📌 Outro compromisso
        </option>

      </select>

    </div>


    <div class="campo">

      <label>
        Cliente
      </label>

      <input
        type="text"
        id="clienteCompromisso"
        placeholder="Nome do cliente"
      >

    </div>


    <div class="campo">

      <label>
        Observação
      </label>

      <textarea
        id="observacaoCompromisso"
        placeholder="Observações..."
      ></textarea>

    </div>


    <div class="botoes-modal">

      <button
        class="btn-fechar"
        onclick="fecharModal()"
      >
        Cancelar
      </button>

      <button
        class="btn-salvar"
        onclick="salvarCompromisso()"
      >
        Salvar
      </button>

    </div>

  </div>

</div>


<script>

  /* =================================
     CONFIGURAÇÃO INICIAL
  ================================= */

  let dataSelecionada = new Date();

  let compromissos = [

    {
      id: 1,
      data: formatarData(new Date()),
      hora: "09:00",
      tipo: "Visita técnica",
      cliente: "Cliente A",
      observacao: "Conferir padrão de entrada",
      status: "pendente"
    },

    {
      id: 2,
      data: formatarData(new Date()),
      hora: "11:30",
      tipo: "Contato com cliente",
      cliente: "Cliente B",
      observacao: "",
      status: "pendente"
    },

    {
      id: 3,
      data: formatarData(new Date()),
      hora: "15:00",
      tipo: "Reunião com cliente",
      cliente: "Cliente C",
      observacao: "",
      status: "pendente"
    },

    {
      id: 4,
      data: formatarData(new Date()),
      hora: "17:00",
      tipo: "Vistoria",
      cliente: "Cliente D",
      observacao: "",
      status: "pendente"
    }

  ];


  /* =================================
     FORMATAR DATA
  ================================= */

  function formatarData(data) {

    const ano = data.getFullYear();

    const mes =
      String(data.getMonth() + 1)
        .padStart(2, "0");

    const dia =
      String(data.getDate())
        .padStart(2, "0");

    return `${ano}-${mes}-${dia}`;

  }


  /* =================================
     FORMATAR DATA PARA EXIBIÇÃO
  ================================= */

  function dataTexto(data) {

    const hoje = new Date();

    const ontem = new Date();

    ontem.setDate(
      hoje.getDate() - 1
    );

    const amanha = new Date();

    amanha.setDate(
      hoje.getDate() + 1
    );


    if (
      formatarData(data) ===
      formatarData(hoje)
    ) {

      return "Hoje";

    }

    if (
      formatarData(data) ===
      formatarData(amanha)
    ) {

      return "Amanhã";

    }

    const dias =
      [
        "Domingo",
        "Segunda-feira",
        "Terça-feira",
        "Quarta-feira",
        "Quinta-feira",
        "Sexta-feira",
        "Sábado"
      ];

    return dias[data.getDay()];

  }


  /* =================================
     GERAR DIAS
  ================================= */

  function gerarDias() {

    const container =
      document.getElementById("dias");

    container.innerHTML = "";


    const inicio = new Date();

    inicio.setDate(
      inicio.getDate() - 3
    );


    for (
      let i = 0;
      i < 14;
      i++
    ) {

      const data =
        new Date(inicio);

      data.setDate(
        inicio.getDate() + i
      );


      const bloco =
        document.createElement("div");

      bloco.className = "dia";


      if (
        formatarData(data) ===
        formatarData(dataSelecionada)
      ) {

        bloco.classList.add(
          "selecionado"
        );

      }


      const temCompromisso =
        compromissos.some(
          item =>
            item.data ===
            formatarData(data)
        );


      bloco.innerHTML = `

        <div class="semana">
          ${data
            .toLocaleDateString(
              "pt-BR",
              { weekday: "short" }
            )
            .replace(".", "")
          }
        </div>

        <div class="numero">
          ${data.getDate()}
        </div>

        <div class="indicador">
          ${temCompromisso ? "●" : ""}
        </div>

      `;


      bloco.onclick = function() {

        dataSelecionada =
          new Date(data);

        renderizar();

      };


      container.appendChild(bloco);

    }

  }


  /* =================================
     RENDERIZAR
  ================================= */

  function renderizar() {

    gerarDias();

    renderizarCompromissos();

  }


  /* =================================
     MOSTRAR COMPROMISSOS
  ================================= */

  function renderizarCompromissos() {

    const lista =
      document.getElementById(
        "listaCompromissos"
      );

    lista.innerHTML = "";


    document.getElementById(
      "tituloDia"
    ).textContent =
      `📅 ${dataTexto(dataSelecionada)}`;


    const data =
      formatarData(dataSelecionada);


    const listaDia =
      compromissos
        .filter(
          item =>
            item.data === data
        )
        .sort(
          (a,b) =>
            a.hora.localeCompare(b.hora)
        );


    if (
      listaDia.length === 0
    ) {

      lista.innerHTML = `

        <div class="vazio">

          📭<br><br>

          Nenhum compromisso
          para este dia.

        </div>

      `;

      return;

    }


    listaDia.forEach(
      compromisso => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "compromisso";


        if (
          compromisso.status ===
          "finalizado"
        ) {

          div.classList.add(
            "finalizado"
          );

        }


        if (
          compromisso.status ===
          "cancelado"
        ) {

          div.classList.add(
            "cancelado"
          );

        }


        const icones = {

          "Reunião com cliente": "🤝",

          "Contato com cliente": "📞",

          "Visita técnica": "📸",

          "Vistoria": "🔍",

          "Acompanhamento de instalação": "🏗️",

          "Comissionamento": "⚡",

          "Outro compromisso": "📌"

        };


        let botoes = "";


        if (
          compromisso.status ===
          "pendente"
        ) {

          botoes = `

            <div class="acoes">

              <button
                class="btn-finalizar"
                onclick="
                  finalizarCompromisso(${compromisso.id})
                "
              >
                ✓ Finalizado
              </button>

              <button
                class="btn-adiar"
                onclick="
                  adiarAmanha(${compromisso.id})
                "
              >
                → Amanhã
              </button>

              <button
                class="btn-adiar"
                onclick="
                  adiarOutraData(${compromisso.id})
                "
              >
                📅 Outra data
              </button>

              <button
                class="btn-cancelar"
                onclick="
                  cancelarCompromisso(${compromisso.id})
                "
              >
                ✕ Cancelar
              </button>

            </div>

          `;

        }


        div.innerHTML = `

          <div class="linha-principal">

            <div class="icone">
              ${icones[compromisso.tipo] || "📌"}
            </div>

            <div>

              <div class="hora">
                ${compromisso.hora}
              </div>

              <div class="titulo">
                ${compromisso.tipo}
              </div>

              <div class="cliente">
                👤 ${compromisso.cliente}
              </div>

              ${
                compromisso.observacao
                ?
                `
                  <div class="observacao">
                    📝 ${compromisso.observacao}
                  </div>
                `
                :
                ""
              }

            </div>

          </div>


          ${
            compromisso.status === "finalizado"
            ?
            `
              <div class="observacao">
                ✅ Finalizado
              </div>
            `
            :
            ""
          }


          ${
            compromisso.status === "cancelado"
            ?
            `
              <div class="observacao">
                ❌ Cancelado
              </div>
            `
            :
            ""
          }


          ${botoes}

        `;


        lista.appendChild(div);

      }
    );

  }


  /* =================================
     NOVO COMPROMISSO
  ================================= */

      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .campo textarea {
      min-height: 75px;
      resize: vertical;
    }

    .botoes-modal {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .botoes-modal button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-salvar {
      background: #0f766e;
      color: white;
    }

    .btn-fechar {
      background: #e2e8f0;
      color: #334155;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- ================================
       TOPO
  ================================= -->

  <div class="topo">

    <a
      href="dashboard.html"
      class="voltar"
    >
      ← Dashboard
    </a>

    <h1>
      📅 Agenda
    </h1>

  </div>


  <!-- ================================
       DIAS
  ================================= -->

  <div class="dias-container">

    <div
      class="dias"
      id="dias"
    ></div>

  </div>


  <!-- ================================
       CABEÇALHO
  ================================= -->

  <div class="cabecalho-dia">

    <h2 id="tituloDia">
      Agenda de hoje
    </h2>

    <button
      class="btn-novo"
      onclick="abrirNovoCompromisso()"
    >
      ＋ Novo
    </button>

  </div>


  <!-- ================================
       COMPROMISSOS
  ================================= -->

  <div
    id="listaCompromissos"
  ></div>


</div>


<!-- ================================
     MODAL NOVO COMPROMISSO
================================= -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-conteudo">

    <h2>
      📅 Novo compromisso
    </h2>


    <div class="campo">

      <label>
        Data
      </label>

      <input
        type="date"
        id="dataCompromisso"
      >

    </div>


    <div class="campo">

      <label>
        Horário
      </label>

      <input
        type="time"
        id="horaCompromisso"
      >

    </div>


    <div class="campo">

      <label>
        Tipo de compromisso
      </label>

      <select
        id="tipoCompromisso"
      >

        <option value="Reunião com cliente">
          🤝 Reunião com cliente
        </option>

        <option value="Contato com cliente">
          📞 Contato com cliente
        </option>

        <option value="Visita técnica">
          📸 Visita técnica
        </option>

        <option value="Vistoria">
          🔍 Vistoria
        </option>

        <option value="Acompanhamento de instalação">
          🏗️ Acompanhamento de instalação
        </option>

        <option value="Comissionamento">
          ⚡ Comissionamento
        </option>

        <option value="Outro compromisso">
          📌 Outro compromisso
        </option>

      </select>

    </div>


    <div class="campo">

      <label>
        Cliente
      </label>

      <input
        type="text"
        id="clienteCompromisso"
        placeholder="Nome do cliente"
      >

    </div>


    <div class="campo">

      <label>
        Observação
      </label>

      <textarea
        id="observacaoCompromisso"
        placeholder="Observações..."
      ></textarea>

    </div>


    <div class="botoes-modal">

      <button
        class="btn-fechar"
        onclick="fecharModal()"
      >
        Cancelar
      </button>

      <button
        class="btn-salvar"
        onclick="salvarCompromisso()"
      >
        Salvar
      </button>

    </div>

  </div>

</div>


<!-- ================================
     MODAL ADIAR
================================= -->

<div
  class="modal"
  id="modalAdiar"
>

  <div class="modal-conteudo">

    <h2>
      → Adiar compromisso
    </h2>


    <button
      class="btn-salvar"
      onclick="adiarParaAmanha()"
      style="
        width:100%;
        margin-bottom:12px;
        padding:12px;
        border:none;
        border-radius:9px;
        font-weight:bold;
        cursor:pointer;
      "
    >
      📅 Amanhã
    </button>


    <div class="campo">

      <label>
        Escolher outra data
      </label>

      <input
        type="date"
        id="novaData"
      >

    </div>


    <div class="botoes-modal">

      <button
        class="btn-fechar"
        onclick="fecharModalAdiar()"
      >
        Cancelar
      </button>

      <button
        class="btn-salvar"
        onclick="salvarNovaData()"
      >
        Adiar
      </button>

    </div>

  </div>

</div>


<script>

  /* ================================
     DADOS DE TESTE
  ================================= */

  let dataSelecionada =
    new Date();


  let compromissos = [

    {
      id: 1,
      data: formatarData(
        new Date()
      ),
      hora: "09:00",
      tipo: "Visita técnica",
      cliente: "Cliente A",
      observacao:
        "Conferir padrão de entrada",
      status: "pendente"
    },

    {
      id: 2,
      data: formatarData(
        new Date()
      ),
      hora: "11:30",
      tipo: "Contato com cliente",
      cliente: "Cliente B",
      observacao: "",
      status: "pendente"
    },

    {
      id: 3,
      data: formatarData(
        new Date()
      ),
      hora: "15:00",
      tipo: "Reunião com cliente",
      cliente: "Cliente C",
      observacao: "",
      status: "pendente"
    },

    {
      id: 4,
      data: formatarData(
        new Date()
      ),
      hora: "17:00",
      tipo: "Vistoria",
      cliente: "Cliente D",
      observacao: "",
      status: "pendente"
    }

  ];


  /* ================================
     FORMATAR DATA
  ================================= */

  function formatarData(data) {

    const ano =
      data.getFullYear();

    const mes =
      String(
        data.getMonth() + 1
      ).padStart(2, "0");

    const dia =
      String(
        data.getDate()
      ).padStart(2, "0");

    return `${ano}-${mes}-${dia}`;

  }


  /* ================================
     TEXTO DA DATA
  ================================= */

  function dataTexto(data) {

    const hoje =
      new Date();

    const amanha =
      new Date();

    amanha.setDate(
      hoje.getDate() + 1
    );


    if (
      formatarData(data) ===
      formatarData(hoje)
    ) {

      return "Hoje";

    }


    if (
      formatarData(data) ===
      formatarData(amanha)
    ) {

      return "Amanhã";

    }


    const dias = [

      "Domingo",

      "Segunda-feira",

      "Terça-feira",

      "Quarta-feira",

      "Quinta-feira",

      "Sexta-feira",

      "Sábado"

    ];


    return dias[
      data.getDay()
    ];

  }


  /* ================================
     GERAR DIAS
  ================================= */

  function gerarDias() {

    const container =
      document.getElementById(
        "dias"
      );

    container.innerHTML = "";


    const inicio =
      new Date();

    inicio.setDate(
      inicio.getDate() - 3
    );


    for (
      let i = 0;
      i < 14;
      i++
    ) {

      const data =
        new Date(inicio);

      data.setDate(
        inicio.getDate() + i
      );


      const bloco =
        document.createElement(
          "div"
        );

      bloco.className =
        "dia";


      if (
        formatarData(data) ===
        formatarData(
          dataSelecionada
        )
      ) {

        bloco.classList.add(
          "selecionado"
        );

      }


      const temCompromisso =
        compromissos.some(
          item =>
            item.data ===
            formatarData(data)
        );


      let nomeDia =
        data
          .toLocaleDateString(
            "pt-BR",
            {
              weekday: "short"
            }
          )
          .replace(".", "");


      if (
        formatarData(data) ===
        formatarData(new Date())
      ) {

        nomeDia =
          "Hoje";

      }


      bloco.innerHTML = `

        <div class="semana">
          ${nomeDia}
        </div>

        <div class="numero">
          ${data.getDate()}
        </div>

        <div class="indicador">
          ${temCompromisso ? "●" : ""}
        </div>

      `;


      bloco.onclick =
        function() {

          dataSelecionada =
            new Date(data);

          renderizar();

        };


      container.appendChild(
        bloco
      );

    }

  }


  /* ================================
     RENDERIZAR
  ================================= */

  function renderizar() {

    gerarDias();

    renderizarCompromissos();

  }


  /* ================================
     RENDERIZAR COMPROMISSOS
  ================================= */

  function renderizarCompromissos() {

    const lista =
      document.getElementById(
        "listaCompromissos"
      );

    lista.innerHTML = "";


    document.getElementById(
      "tituloDia"
    ).textContent =
      `📅 ${dataTexto(
        dataSelecionada
      )}`;


    const data =
      formatarData(
        dataSelecionada
      );


    const listaDia =
      compromissos
        .filter(
          item =>
            item.data === data
        )
        .sort(
          (a, b) =>
            a.hora.localeCompare(
              b.hora
            )
        );


    if (
      listaDia.length === 0
    ) {

      lista.innerHTML = `

        <div class="vazio">

          📭

          <br><br>

          Nenhum compromisso
          para este dia.

        </div>

      `;

      return;

    }


    listaDia.forEach(
      compromisso => {


        const div =
          document.createElement(
            "div"
          );


        const agora =
          new Date();


        const dataCompromisso =
          new Date(
            compromisso.data +
            "T" +
            compromisso.hora
          );


        const atrasado =
          compromisso.status ===
          "pendente" &&
          dataCompromisso < agora;


        div.className =
          "compromisso";


        if (atrasado) {

          div.classList.add(
            "atrasado"
          );

        }


        if (
          compromisso.status ===
          "finalizado"
        ) {

          div.classList.add(
            "finalizado"
          );

        }


        if (
          compromisso.status ===
          "cancelado"
        ) {

          div.classList.add(
            "cancelado"
          );

        }


        const icones = {

          "Reunião com cliente":
            "🤝",

          "Contato com cliente":
            "📞",

          "Visita técnica":
            "📸",

          "Vistoria":
            "🔍",

          "Acompanhamento de instalação":
            "🏗️",

          "Comissionamento":
            "⚡",

          "Outro compromisso":
            "📌"

        };


        let botoes = "";


        if (
          compromisso.status ===
          "pendente"
        ) {

          botoes = `

            <div class="acoes">

              <button
                class="btn-finalizar"
                onclick="
                  finalizarCompromisso(
                    ${compromisso.id}
                  )
                "
              >
                ✓ Finalizar
              </button>


              <button
                class="btn-adiar"
                onclick="
                  abrirAdiar(
                    ${compromisso.id}
                  )
                "
              >
                → Adiar
              </button>


              <button
                class="btn-cancelar"
                onclick="
                  cancelarCompromisso(
                    ${compromisso.id}
                  )
                "
              >
                ✕ Cancelar
              </button>

            </div>

          `;

        }


        div.innerHTML = `

          <div class="linha-principal">

            <div class="icone">

              ${
                icones[
                  compromisso.tipo
                ] || "📌"
              }

            </div>


            <div>

              <div class="hora">

                ${compromisso.hora}

                ${
                  atrasado
                  ?
                  `
                    <span
                      style="
                        color:#dc2626;
                        font-size:10px;
                        margin-left:5px;
                      "
                    >
                      🔴 ATRASADO
                    </span>
                  `
                  :
                  ""
                }

              </div>


              <div class="titulo">

                ${compromisso.tipo}

              </div>


              <div class="cliente">

                👤 ${compromisso.cliente}

              </div>


              ${
                compromisso.observacao
                ?
                `
                  <div class="observacao">

                    📝
                    ${compromisso.observacao}

                  </div>
                `
                :
                ""
              }


              ${
                compromisso.status ===
                "finalizado"
                ?
                `
                  <div class="observacao">

                    ✅ Finalizado

                  </div>
                `
                :
                ""
              }


              ${
                compromisso.status ===
                "cancelado"
                ?
                `
                  <div class="observacao">

                    ❌ Cancelado

                  </div>
                `
                :
                ""
              }

            </div>

          </div>


          ${botoes}

        `;


        lista.appendChild(
          div
        );

      }
    );

  }


  /* ================================
     NOVO COMPROMISSO
  ================================= */

  function abrirNovoCompromisso() {

    document.getElementById(
      "dataCompromisso"
    ).value =
      formatarData(
        dataSelecionada
      );


    document.getElementById(
      "horaCompromisso"
    ).value = "";


    document.getElementById(
      "clienteCompromisso"
    ).value = "";


    document.getElementById(
      "observacaoCompromisso"
    ).value = "";


    document.getElementById(
      "modal"
    ).classList.add(
      "aberto"
    );

  }


  function fecharModal() {

    document.getElementById(
      "modal"
    ).classList.remove(
      "aberto"
    );

  }


  /* ================================
     SALVAR COMPROMISSO
  ================================= */

  function salvarCompromisso() {

    const data =
      document.getElementById(
        "dataCompromisso"
      ).value;


    const hora =
      document.getElementById(
        "horaCompromisso"
      ).value;


    const tipo =
      document.getElementById(
        "tipoCompromisso"
      ).value;


    const cliente =
      document.getElementById(
        "clienteCompromisso"
      ).value.trim();


    const observacao =
      document.getElementById(
        "observacaoCompromisso"
      ).value.trim();


    if (
      !data ||
      !hora ||
      !cliente
    ) {

      alert(
        "Informe data, horário e cliente."
      );

      return;

    }


    compromissos.push({

      id:
        Date.now(),

      data,

      hora,

      tipo,

      cliente,

      observacao,

      status:
        "pendente"

    });


    dataSelecionada =
      new Date(
        data + "T00:00:00"
      );


    fecharModal();

    renderizar();

  }


  /* ================================
     FINALIZAR
  ================================= */

  function finalizarCompromisso(
    id
  ) {

    const item =
      compromissos.find(
        x =>
          x.id === id
      );


    if (!item)
      return;


    item.status =
      "finalizado";


    renderizar();

  }


  /* ================================
     CANCELAR
  ================================= */

  function cancelarCompromisso(
    id
  ) {

    const confirmar =
      confirm(
        "Deseja cancelar este compromisso?"
      );


    if (!confirmar)
      return;


    const item =
      compromissos.find(
        x =>
          x.id === id
      );


    if (!item)
      return;


    item.status =
      "cancelado";


    renderizar();

  }


  /* ================================
     ADIAR
  ================================= */

  let compromissoAdiarId =
    null;


  function abrirAdiar(id) {

    compromissoAdiarId =
      id;


    document.getElementById(
      "novaData"
    ).value = "";


    document.getElementById(
      "modalAdiar"
    ).classList.add(
      "aberto"
    );

  }


  function fecharModalAdiar() {

    document.getElementById(
      "modalAdiar"
    ).classList.remove(
      "aberto"
    );


    compromissoAdiarId =
      null;

  }


  /* ================================
     ADIAR PARA AMANHÃ
  ================================= */

  function adiarParaAmanha() {

    if (
      !compromissoAdiarId
    )
      return;


    const item =
      compromissos.find(
        x =>
          x.id ===
          compromissoAdiarId
      );


    if (!item)
      return;


    const data =
      new Date(
        item.data +
        "T00:00:00"
      );


    data.setDate(
      data.getDate() + 1
    );


    item.data =
      formatarData(data);


    dataSelecionada =
      data;


    fecharModalAdiar();

    renderizar();

  }


  /* ================================
     ADIAR PARA OUTRA DATA
  ================================= */

  function salvarNovaData() {

    if (
      !compromissoAdiarId
    )
      return;


    const novaData =
      document.getElementById(
        "novaData"
      ).value;


    if (!novaData) {

      alert(
        "Escolha uma data."
      );

      return;

    }


    const item =
      compromissos.find(
        x =>
          x.id ===
          compromissoAdiarId
      );


    if (!item)
      return;


    item.data =
      novaData;


    dataSelecionada =
      new Date(
        novaData +
        "T00:00:00"
      );


    fecharModalAdiar();

    renderizar();

  }


  /* ================================
     INICIAR
  ================================= */

  renderizar();

</script>


</body>

</html>
