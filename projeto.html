
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Novo Projeto - HomologaSolar RT</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

header {
  background: #0f766e;
  color: white;
  padding: 18px;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

h2 {
  margin-top: 0;
}

.campo {
  margin-bottom: 16px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.acoes {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 13px 16px;
  font-weight: bold;
  cursor: pointer;
  flex: 1;
}

.btn-principal {
  background: #0f766e;
  color: white;
}

.btn-secundario {
  background: #e2e8f0;
  color: #334155;
}

button:disabled {
  opacity: .6;
}

.erro {
  display: none;
  background: #fee2e2;
  color: #991b1b;
  padding: 14px;
  border-radius: 9px;
  margin-bottom: 15px;
}

.sucesso {
  display: none;
  background: #dcfce7;
  color: #166534;
  padding: 14px;
  border-radius: 9px;
  margin-bottom: 15px;
}

.carregando {
  text-align: center;
  color: #64748b;
  padding: 20px;
}

</style>

</head>

<body>

<header>

<h1>☀️ HomologaSolar RT</h1>

</header>


<div class="container">

<div class="card">

<h2>📁 Novo projeto</h2>

<div
  id="erro"
  class="erro"
></div>

<div
  id="sucesso"
  class="sucesso"
></div>


<form id="formProjeto">


<div class="campo">

<label>
Cliente *
</label>

<select
  id="cliente_id"
  required
>

<option value="">
Carregando clientes...
</option>

</select>

</div>


<div class="campo">

<label>
Nome do projeto *
</label>

<input
  id="nome"
  placeholder="Ex.: Sistema Fotovoltaico - Cliente Teste"
  required
>

</div>


<div class="campo">

<label>
Responsável Técnico
</label>

<select
  id="responsavel_tecnico_id"
>

<option value="">
Nenhum RT selecionado
</option>

</select>

</div>


<div class="campo">

<label>
Observações
</label>

<textarea
  id="observacoes"
  placeholder="Observações iniciais do projeto..."
></textarea>

</div>


<div class="acoes">

<button
  type="button"
  class="btn-secundario"
  onclick="window.location.href='dashboard.html'"
>
Cancelar
</button>

<button
  type="submit"
  class="btn-principal"
  id="btnSalvar"
>
Salvar rascunho
</button>

</div>

</form>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioAtual = null;
let organizacaoAtual = null;


/* =========================================
   INICIAR
========================================= */

async function iniciar() {

  try {

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return;

    }


    usuarioAtual =
      data.user;


    /* ================================
       DESCOBRIR ORGANIZAÇÃO
    ================================= */

    const {
      data: membro,
      error: erroMembro
    } =
    await supabaseClient
      .from("organizacao_membros")
      .select("organizacao_id")
      .eq(
        "usuario_id",
        usuarioAtual.id
      )
      .eq(
        "ativo",
        true
      )
      .limit(1)
      .maybeSingle();


    if (erroMembro)
      throw erroMembro;


    if (!membro) {

      throw new Error(
        "Usuário sem organização."
      );

    }


    organizacaoAtual =
      membro.organizacao_id;


    await carregarClientes();

    await carregarRTs();

  }

  catch (erro) {

    mostrarErro(
      erro.message
    );

  }

}


/* =========================================
   CLIENTES
========================================= */

async function carregarClientes() {

  const {
    data,
    error
  } =
  await supabaseClient
    .from("clientes")
    .select(`
      id,
      nome
    `)
    .eq(
      "organizacao_id",
      organizacaoAtual
    )
    .order(
      "nome",
      {
        ascending: true
      }
    );


  if (error)
    throw error;


  const select =
    document.getElementById(
      "cliente_id"
    );


  select.innerHTML =
    `<option value="">
      Selecione um cliente
    </option>`;


  if (
    !data ||
    data.length === 0
  ) {

    select.innerHTML =
      `<option value="">
        Nenhum cliente cadastrado
      </option>`;

    return;

  }


  data.forEach(cliente => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      cliente.id;

    option.textContent =
      cliente.nome;

    select.appendChild(
      option
    );

  });

}


/* =========================================
   RESPONSÁVEIS TÉCNICOS
========================================= */

async function carregarRTs() {

  const {
    data,
    error
  } =
  await supabaseClient
    .from("responsaveis_tecnicos")
    .select(`
      id,
      nome,
      crea,
      uf_crea
    `)
    .eq(
      "organizacao_id",
      organizacaoAtual
    )
    .eq(
      "ativo",
      true
    )
    .order(
      "nome",
      {
        ascending: true
      }
    );


  if (error)
    throw error;


  const select =
    document.getElementById(
      "responsavel_tecnico_id"
    );


  select.innerHTML =
    `<option value="">
      Nenhum RT selecionado
    </option>`;


  if (!data)
    return;


  data.forEach(rt => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      rt.id;

    option.textContent =
      rt.nome +
      " - CREA " +
      rt.crea +
      (
        rt.uf_crea
          ? "/" + rt.uf_crea
          : ""
      );

    select.appendChild(
      option
    );

  });

}


/* =========================================
   SALVAR PROJETO
========================================= */

document
  .getElementById("formProjeto")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const botao =
        document.getElementById(
          "btnSalvar"
        );


      botao.disabled = true;

      botao.textContent =
        "Salvando...";


      try {

        const clienteId =
          document
            .getElementById("cliente_id")
            .value;


        const nome =
          document
            .getElementById("nome")
            .value
            .trim();


        const rtId =
          document
            .getElementById(
              "responsavel_tecnico_id"
            )
            .value;


        const observacoes =
          document
            .getElementById(
              "observacoes"
            )
            .value
            .trim();


        if (!clienteId) {

          throw new Error(
            "Selecione um cliente."
          );

        }


        if (!nome) {

          throw new Error(
            "Informe o nome do projeto."
          );

        }


        const {
          data,
          error
        } =
        await supabaseClient
          .from("projetos")
          .insert({

            organizacao_id:
              organizacaoAtual,

            cliente_id:
              clienteId,

            nome:
              nome,

            status:
              "rascunho",

            observacoes:
              observacoes || null,

            criado_por:
              usuarioAtual.id,

            responsavel_tecnico_id:
              rtId || null

          })
          .select()
          .single();


        if (error)
          throw error;


        mostrarSucesso(
          "Projeto criado com sucesso!"
        );


        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 1200);

      }

      catch (erro) {

        mostrarErro(
          erro.message
        );

      }

      finally {

        botao.disabled = false;

        botao.textContent =
          "Salvar rascunho";

      }

    }
  );


/* =========================================
   MENSAGENS
========================================= */

function mostrarErro(mensagem) {

  const elemento =
    document.getElementById(
      "erro"
    );

  elemento.textContent =
    "ERRO: " + mensagem;

  elemento.style.display =
    "block";

}


function mostrarSucesso(mensagem) {

  const elemento =
    document.getElementById(
      "sucesso"
    );

  elemento.textContent =
    mensagem;

  elemento.style.display =
    "block";

}


iniciar();

</script>

</body>

  </html>
