<script>

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let usuarioAtual = null;

let organizacaoAtual = null;

let moduloSelecionado = null;
let inversorSelecionado = null;


/* =========================================
INICIAR
========================================= */

async function iniciar() {

try {

const {
data,
error
} =
await supabaseClient.auth.getUser();


if (
error ||
!data.user
) {

window.location.href =
"login.html";

return;

}


usuarioAtual =
data.user;


/* =========================================
DESCOBRIR ORGANIZAÇÃO
========================================= */

const {
data: membro,
error: erroMembro
} =
await supabaseClient
.from("organizacao_membros")
.select("organizacao_id")
.eq(
"usuario_id",
usuarioAtual.id
)
.eq(
"ativo",
true
)
.limit(1)
.maybeSingle();


if (erroMembro)
throw erroMembro;


if (!membro) {

throw new Error(
"Usuário sem organização."
);

}


organizacaoAtual =
membro.organizacao_id;


await carregarClientes();

await carregarRTs();

}

catch (erro) {

mostrarErro(
erro.message
);

}

}


/* =========================================
CLIENTES
========================================= */

async function carregarClientes() {

const {
data,
error
} =
await supabaseClient
.from("clientes")
.select(`
id,
nome
`)
.eq(
"organizacao_id",
organizacaoAtual
)
.order(
"nome",
{
ascending: true
}
);


if (error)
throw error;


const select =
document.getElementById(
"cliente_id"
);


select.innerHTML =
`<option value="">
Selecione um cliente
</option>`;


if (
!data ||
data.length === 0
) {

select.innerHTML =
`<option value="">
Nenhum cliente cadastrado
</option>`;

return;

}


data.forEach(cliente => {

const option =
document.createElement(
"option"
);

option.value =
cliente.id;

option.textContent =
cliente.nome;

select.appendChild(
option
);

});

}


/* =========================================
CADASTRO RÁPIDO DE CLIENTE
========================================= */

function mostrarCadastroCliente() {

document.getElementById(
"cadastroCliente"
).style.display = "block";

document.getElementById(
"novo_cliente_nome"
).focus();

}


function cancelarCadastroCliente() {

document.getElementById(
"cadastroCliente"
).style.display = "none";

document.getElementById(
"novo_cliente_nome"
).value = "";

document.getElementById(
"novo_cliente_cpf_cnpj"
).value = "";

document.getElementById(
"novo_cliente_email"
).value = "";

document.getElementById(
"novo_cliente_telefone"
).value = "";

}


async function salvarNovoCliente() {

const botao =
document.getElementById(
"btnSalvarCliente"
);

const nome =
document.getElementById(
"novo_cliente_nome"
).value.trim();

const cpfCnpj =
document.getElementById(
"novo_cliente_cpf_cnpj"
).value.trim();

const email =
document.getElementById(
"novo_cliente_email"
).value.trim();

const telefone =
document.getElementById(
"novo_cliente_telefone"
).value.trim();


if (!nome) {

mostrarErro(
"Informe o nome do cliente."
);

return;

}


botao.disabled = true;

botao.textContent =
"Salvando...";


try {

const {
data,
error
} =
await supabaseClient
.from("clientes")
.insert({

organizacao_id:
organizacaoAtual,

nome:
nome,

cpf_cnpj:
cpfCnpj || null,

email:
email || null,

telefone:
telefone || null,

criado_por:
usuarioAtual.id

})
.select()
.single();


if (error)
throw error;


const select =
document.getElementById(
"cliente_id"
);


const option =
document.createElement(
"option"
);


option.value =
data.id;

option.textContent =
data.nome;


select.appendChild(
option
);


select.value =
data.id;


cancelarCadastroCliente();


mostrarSucesso(
"Cliente cadastrado com sucesso!"
);

}

catch (erro) {

mostrarErro(
erro.message
);

}

finally {

botao.disabled = false;

botao.textContent =
"Salvar cliente";

}

}


/* =========================================
RESPONSÁVEIS TÉCNICOS
========================================= */

async function carregarRTs() {

const {
data,
error
} =
await supabaseClient
.from("responsaveis_tecnicos")
.select(`
id,
nome,
crea,
uf_crea
`)
.eq(
"organizacao_id",
organizacaoAtual
)
.eq(
"ativo",
true
)
.order(
"nome",
{
ascending: true
}
);


if (error)
throw error;


const select =
document.getElementById(
"responsavel_tecnico_id"
);


select.innerHTML =
`<option value="">
Nenhum RT selecionado
</option>`;


if (!data)
return;


data.forEach(rt => {

const option =
document.createElement(
"option"
);

option.value =
rt.id;

option.textContent =
rt.nome +
" - CREA " +
rt.crea +
(
rt.uf_crea
? "/" + rt.uf_crea
: ""
);

select.appendChild(
option
);

});

}


/* =========================================
CARREGAR FABRICANTES
========================================= */

    async function carregarFabricantesEquipamentos() {

    const tipo =
        document.getElementById("equipamento_tipo").value;

    const fabricante =
        document.getElementById("equipamento_fabricante");

    const modelo =
        document.getElementById("equipamento_modelo");


    fabricante.innerHTML =
        '<option value="">Carregando...</option>';

    fabricante.disabled = true;

    modelo.innerHTML =
        '<option value="">Selecione o fabricante</option>';

    modelo.disabled = true;

    document.getElementById(
        "dadosEquipamento"
    ).style.display = "none";


    if (!tipo) {

        fabricante.innerHTML =
            '<option value="">Primeiro selecione o tipo</option>';

        return;
    }


    /*
     * Busca os fabricantes na tabela correta:
     * fabricantes_equipamentos
     */

    let tipoFabricante = "";


    if (tipo === "modulo") {

        tipoFabricante =
            "fabricante de módulos fotovoltaicos";

    } else if (tipo === "inversor") {

        tipoFabricante =
            "fabricante de inversores";

    }


    const {
        data,
        error
    } = await supabaseClient

        .from("fabricantes_equipamentos")

        .select(`
            id,
            nome,
            tipo_fabricante
        `)

        .eq(
            "tipo_fabricante",
            tipoFabricante
        )

        .eq(
            "ativo",
            true
        )

        .order(
            "nome",
            {
                ascending: true
            }
        );


    if (error) {

    console.error(
        "Erro ao carregar fabricantes:",
        error
    );

    fabricante.innerHTML =
        '<option value="">ERRO: ' +
        error.message +
        '</option>';

    fabricante.disabled = false;

    return;
    }


    fabricante.innerHTML =
        '<option value="">Selecione o fabricante</option>';


    (data || []).forEach(
        item => {

            const option =
                document.createElement("option");

            option.value =
                item.id;

            option.textContent =
                item.nome;

            fabricante.appendChild(option);

        }
    );


    fabricante.disabled =
        !data ||
        data.length === 0;

    }

/* =========================================
CARREGAR MODELOS
========================================= */

async function carregarModelosEquipamentos() {

    const tipo =
        document.getElementById(
            "equipamento_tipo"
        ).value;

    const fabricanteId =
        document.getElementById(
            "equipamento_fabricante"
        ).value;

    const modelo =
        document.getElementById(
            "equipamento_modelo"
        );


    modelo.innerHTML =
        '<option value="">Carregando...</option>';

    modelo.disabled = true;


    if (!tipo || !fabricanteId) {

        modelo.innerHTML =
            '<option value="">Selecione o fabricante</option>';

        return;
    }


    const {
        data,
        error
    } = await supabaseClient

        .from("equipamentos_fotovoltaicos")

        .select(`
            id,
            modelo,
            fabricante_id,
            tipo
        `)

        .eq(
            "tipo",
            tipo
        )

        .eq(
            "fabricante_id",
            fabricanteId
        )

        .eq(
            "ativo",
            true
        )

        .order(
            "modelo",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar modelos:",
            error
        );

        modelo.innerHTML =
            '<option value="">Erro ao carregar</option>';

        return;
    }


    modelo.innerHTML =
        '<option value="">Selecione o modelo</option>';


    (data || []).forEach(
        item => {

            const option =
                document.createElement("option");

            option.value =
                item.id;

            option.textContent =
                item.modelo;

            modelo.appendChild(option);

        }
    );


    modelo.disabled =
        !data ||
        data.length === 0;

}

/* =========================================
CARREGAR FABRICANTES
========================================= */

async function buscarFabricantes(tipoFabricante) {

    const {
        data,
        error
    } = await supabaseClient

        .from("fabricantes_equipamentos")

        .select(`
            id,
            nome,
            tipo_fabricante
        `)

        .eq(
            "tipo_fabricante",
            tipoFabricante
        )

        .eq(
            "ativo",
            true
        )

        .order(
            "nome",
            {
                ascending: true
            }
        );


    if (error)
        throw error;


    return data || [];
}


/* =========================================
MÓDULO - FABRICANTES
========================================= */

async function carregarFabricantesModulo() {

    const select =
        document.getElementById(
            "modulo_fabricante"
        );

    select.innerHTML =
        '<option value="">Carregando...</option>';

    try {

        const fabricantes =
            await buscarFabricantes(
                "fabricante de módulos fotovoltaicos"
            );


        select.innerHTML =
            '<option value="">Selecione o fabricante</option>';


        fabricantes.forEach(
            fabricante => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    fabricante.id;

                option.textContent =
                    fabricante.nome;

                select.appendChild(
                    option
                );

            }
        );

    }

    catch (erro) {

        console.error(
            "Erro ao carregar fabricantes de módulos:",
            erro
        );

        select.innerHTML =
            '<option value="">Erro ao carregar</option>';

    }

}


/* =========================================
MÓDULO - MODELOS
========================================= */

async function carregarModelosModulo() {

    const fabricanteId =
        document.getElementById(
            "modulo_fabricante"
        ).value;

    const modelo =
        document.getElementById(
            "modulo_modelo"
        );


    modelo.innerHTML =
        '<option value="">Carregando...</option>';

    modelo.disabled = true;

    moduloSelecionado = null;


    document.getElementById(
        "dadosModulo"
    ).style.display = "none";


    if (!fabricanteId) {

        modelo.innerHTML =
            '<option value="">Selecione o fabricante</option>';

        return;

    }


    const {
        data,
        error
    } = await supabaseClient

        .from("equipamentos_fotovoltaicos")

        .select(`
            id,
            modelo,
            fabricante_id,
            tipo
        `)

        .eq(
            "tipo",
            "modulo"
        )

        .eq(
            "fabricante_id",
            fabricanteId
        )

        .eq(
            "ativo",
            true
        )

        .order(
            "modelo",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar modelos de módulos:",
            error
        );

        modelo.innerHTML =
            '<option value="">Erro ao carregar</option>';

        return;

    }


    modelo.innerHTML =
        '<option value="">Selecione o modelo</option>';


    (data || []).forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                item.id;

            option.textContent =
                item.modelo;

            modelo.appendChild(
                option
            );

        }
    );


    modelo.disabled =
        !data ||
        data.length === 0;

}


/* =========================================
MÓDULO - DADOS
========================================= */

async function carregarDadosModulo() {

    const id =
        document.getElementById(
            "modulo_modelo"
        ).value;


    const caixa =
        document.getElementById(
            "dadosModulo"
        );

    const texto =
        document.getElementById(
            "dadosModuloTexto"
        );


    caixa.style.display =
        "none";

    moduloSelecionado =
        null;

                    fabricante.nome;

                select.appendChild(
                    option

async function carregarModelosInversor() {

    const fabricanteId =
        document.getElementById(
            "inversor_fabricante"
        ).value;

    const modelo =
        document.getElementById(
            "inversor_modelo"
        );


    modelo.innerHTML =
        '<option value="">Carregando...</option>';

    modelo.disabled = true;

    inversorSelecionado = null;


    document.getElementById(
        "dadosInversor"
    ).style.display = "none";


    if (!fabricanteId) {

        modelo.innerHTML =
            '<option value="">Selecione o fabricante</option>';

        return;

    }


    const {
        data,
        error
    } = await supabaseClient

        .from("equipamentos_fotovoltaicos")

        .select(`
            id,
            modelo,
            fabricante_id,
            tipo
        `)

        .eq(
            "tipo",
            "inversor"
        )

        .eq(
            "fabricante_id",
            fabricanteId
        )

        .eq(
            "ativo",
            true
        )

        .order(
            "modelo",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar modelos de inversores:",
            error
        );

        modelo.innerHTML =
            '<option value="">Erro ao carregar</option>';

        return;

    }


    modelo.innerHTML =
        '<option value="">Selecione o modelo</option>';


    (data || []).forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                item.id;

            option.textContent =
                item.modelo;

            modelo.appendChild(
                option
            );

        }
    );


    modelo.disabled =
        !data ||
        data.length === 0;

}
