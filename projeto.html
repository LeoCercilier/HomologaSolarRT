	<head>

		<meta charset="UTF-8">

	<body>

						<label>

					<div

							<label>
								Nome *

						<div class="campo">

							<label>

							<input

								type="email"

						</div>

						<div class="campo">

							<label>
								Telefone
							</label>

							<input
								id="novo_cliente_telefone"
								placeholder="Telefone / WhatsApp"
							>

						</div>

						<div class="acoes">

							<button
								type="button"
								class="btn-secundario"
								onclick="cancelarCadastroCliente()"
							>
								Cancelar
							</button>

							<button
								type="button"
								class="btn-principal"
								id="btnSalvarCliente"

					</div>

					<div class="campo">

						<label>
							Nome do projeto *
						</label>

						<input
							id="nome"
							placeholder="Ex.: Sistema Fotovoltaico - Cliente Teste"
							required
						>

					</div>

					<!-- =========================================
     EQUIPAMENTOS DO SISTEMA FV
========================================= -->

					<div class="campo">

						<label>
							Responsável Técnico
						</label>

						<select
							id="responsavel_tecnico_id"
						>

							<option value="">
								Nenhum RT selecionado
							</option>

						</select>

					</div>


					<div class="campo">

						<label>
							Observações
						</label>

						<textarea
							id="observacoes"
							placeholder="Observações iniciais do projeto..."
						></textarea>

					</div>


					<div class="acoes">

						<button
							type="button"

							onclick="window.location.href='dashboard.html'"

							Cancelar
						</button>

						<button

						</button>

		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

		<script src="supabase-config.js"></script>


		<script>

			const supabaseClient =
			window.supabase.createClient(
			SUPABASE_URL,
			SUPABASE_KEY
			);


			let usuarioAtual = null;
			let organizacaoAtual = null;


			/* =========================================
			INICIAR
			========================================= */

			async function iniciar() {

			try {

			const {
			data,
			error
			} =
			await supabaseClient.auth.getUser();


			if (
			error ||
			!data.user
			) {

			window.location.href =
			"login.html";

			return;

			}


			usuarioAtual =
			data.user;


			/* ================================
			DESCOBRIR ORGANIZAÇÃO
			================================= */

			const {
			data: membro,
			error: erroMembro
			} =
			await supabaseClient
			.from("organizacao_membros")
			.select("organizacao_id")
			.eq(
			"usuario_id",
			usuarioAtual.id
			)
			.eq(
			"ativo",
			true
			)
			.limit(1)
			.maybeSingle();


			if (erroMembro)
			throw erroMembro;


			if (!membro) {

			throw new Error(
			"Usuário sem organização."
			);

			}


			organizacaoAtual =
			membro.organizacao_id;


			await carregarClientes();

			await carregarRTs();

			}

			catch (erro) {

			mostrarErro(
			erro.message
			);

			}

			}


			/* =========================================
			CLIENTES
			========================================= */

			async function carregarClientes() {

			const {
			data,
			error
			} =
			await supabaseClient
			.from("clientes")
			.select(`
			id,
			nome
			`)
			.eq(
			"organizacao_id",
			organizacaoAtual
			)
			.order(
			"nome",
			{
			ascending: true
			}
			);


			if (error)
			throw error;


			const select =
			document.getElementById(
			"cliente_id"
			);


			select.innerHTML =
			`<option value="">
				Selecione um cliente
			</option>`;


			if (
			!data ||
			data.length === 0
			) {

			select.innerHTML =
			`<option value="">
				Nenhum cliente cadastrado
			</option>`;

			return;

			}


			data.forEach(cliente => {

			const option =
			document.createElement(
			"option"
			);

			option.value =
			cliente.id;

			option.textContent =
			cliente.nome;

			select.appendChild(
			option
			);

			});

			}

			/* =========================================
			CADASTRO RÁPIDO DE CLIENTE
			========================================= */

			function mostrarCadastroCliente() {

			document.getElementById(
			"cadastroCliente"
			).style.display = "block";

			document.getElementById(
			"novo_cliente_nome"
			).focus();

			}


			function cancelarCadastroCliente() {

			document.getElementById(
			"cadastroCliente"
			).style.display = "none";

			document.getElementById(
			"novo_cliente_nome"
			).value = "";

			document.getElementById(
			"novo_cliente_cpf_cnpj"
			).value = "";

			document.getElementById(
			"novo_cliente_email"
			).value = "";

			document.getElementById(
			"novo_cliente_telefone"
			).value = "";

			}


			async function salvarNovoCliente() {

			const botao =
			document.getElementById(
			"btnSalvarCliente"
			);

			const nome =
			document.getElementById(
			"novo_cliente_nome"
			).value.trim();

			const cpfCnpj =
			document.getElementById(
			"novo_cliente_cpf_cnpj"
			).value.trim();

			const email =
			document.getElementById(
			"novo_cliente_email"
			).value.trim();

			const telefone =
			document.getElementById(
			"novo_cliente_telefone"
			).value.trim();


			if (!nome) {

			mostrarErro(
			"Informe o nome do cliente."
			);

			return;

			}


			botao.disabled = true;

			botao.textContent =
			"Salvando...";


			try {

			const {
			data,
			error
			} =
			await supabaseClient
			.from("clientes")
			.insert({

			organizacao_id:
			organizacaoAtual,

			nome:
			nome,

			cpf_cnpj:
			cpfCnpj || null,

			email:
			email || null,

			telefone:
			telefone || null,

			criado_por:
			usuarioAtual.id

			})
			.select()
			.single();


			if (error)
			throw error;


			/*
			Adiciona o novo cliente
			imediatamente na lista
			*/

			const select =
			document.getElementById(
			"cliente_id"
			);


			const option =
			document.createElement(
			"option"
			);


			option.value =
			data.id;

			option.textContent =
			data.nome;


			select.appendChild(
			option
			);


			/*
			Seleciona automaticamente
			o cliente recém-criado
			*/

			select.value =
			data.id;


			/*
			Fecha o formulário
			*/

			cancelarCadastroCliente();


			mostrarSucesso(
			"Cliente cadastrado com sucesso!"
			);


			}

			catch (erro) {

			mostrarErro(
			erro.message
			);

			}

			finally {

			botao.disabled = false;

			botao.textContent =
			"Salvar cliente";

			}

			}

			/* =========================================
			RESPONSÁVEIS TÉCNICOS
			========================================= */

			async function carregarRTs() {

			const {
			data,
			error
			} =
			await supabaseClient
			.from("responsaveis_tecnicos")
			.select(`
			id,
			nome,
			crea,
			uf_crea
			`)
			.eq(
			"organizacao_id",
			organizacaoAtual
			)
			.eq(
			"ativo",
			true
			)
			.order(
			"nome",
			{
			ascending: true
			}
			);


			if (error)
			throw error;


			const select =
			document.getElementById(
			"responsavel_tecnico_id"
			);


			select.innerHTML =
			`<option value="">
				Nenhum RT selecionado
			</option>`;


			if (!data)
			return;


			data.forEach(rt => {

			const option =
			document.createElement(
			"option"
			);

			option.value =
			rt.id;

			option.textContent =
			rt.nome +
			" - CREA " +
			rt.crea +
			(
			rt.uf_crea
			? "/" + rt.uf_crea
			: ""
			);

			select.appendChild(
			option
			);

			});

			}


			/* =========================================
			SALVAR PROJETO
			========================================= */

			document
			.getElementById("formProjeto")
			.addEventListener(
			"submit",
			async function(event) {

			event.preventDefault();


			const botao =
			document.getElementById(
			"btnSalvar"
			);


			botao.disabled = true;

			botao.textContent =
			"Salvando...";


			try {

			const clienteId =
			document
            .getElementById("cliente_id")
            .value;


			const nome =
			document
            .getElementById("nome")
            .value
            .trim();


			const rtId =
			document
            .getElementById(
			"responsavel_tecnico_id"
            )
            .value;


			const observacoes =
			document
            .getElementById(
			"observacoes"
            )
            .value
            .trim();


			if (!clienteId) {

			throw new Error(
            "Selecione um cliente."
			);

			}


			if (!nome) {

			throw new Error(
            "Informe o nome do projeto."
			);

			}


			const {
			data,
			error
			} =
			await supabaseClient
			.from("projetos")
			.insert({

            organizacao_id:
			organizacaoAtual,

            cliente_id:
			clienteId,

            nome:
			nome,

            status:
			"rascunho",

            observacoes:
			observacoes || null,

            criado_por:
			usuarioAtual.id,

            responsavel_tecnico_id:
			rtId || null

			})
			.select()
			.single();


			if (error)
			throw error;


			mostrarSucesso(
			"Projeto criado com sucesso!"
			);


			setTimeout(() => {

			window.location.href =
			"projeto-detalhes.html?id=" + data.id;

			}, 1200);

			}

			catch (erro) {

			mostrarErro(
			erro.message
			);

			}

			finally {

			botao.disabled = false;

			botao.textContent =
			"Salvar rascunho";

			}

			}
			);

			/* =========================================
   BANCO DE EQUIPAMENTOS
========================================= */

async function carregarFabricantesEquipamentos() {

    const tipo =
        document.getElementById(
            "equipamento_tipo"
        ).value;

    const fabricante =
        document.getElementById(
            "equipamento_fabricante"
        );

    const modelo =
        document.getElementById(
            "equipamento_modelo"
        );

    fabricante.innerHTML =
        '<option value="">Carregando...</option>';

    fabricante.disabled = true;

    modelo.innerHTML =
        '<option value="">Selecione o fabricante</option>';

    modelo.disabled = true;

    document.getElementById(
        "dadosEquipamento"
    ).style.display = "none";


    if (!tipo) {

        fabricante.innerHTML =
            '<option value="">Primeiro selecione o tipo</option>';

        return;
    }


    const {
        data,
        error
    } = await supabaseClient

        .from("equipamentos")

        .select(`
            id,
            fabricante
        `)

        .eq(
            "tipo",
            tipo
        )

        .eq(
            "situacao",
            "Ativo"
        )

        .order(
            "fabricante",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar fabricantes:",
            error
        );

        fabricante.innerHTML =
            '<option value="">Erro ao carregar</option>';

        return;
    }


    const fabricantes =
        [
            ...new Set(
                (data || [])
                    .map(
                        item =>
                            item.fabricante
                    )
                    .filter(Boolean)
            )
        ];


    fabricante.innerHTML =
        '<option value="">Selecione o fabricante</option>';


    fabricantes.forEach(
        nome => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                nome;

            option.textContent =
                nome;

            fabricante.appendChild(
                option
            );

        }
    );


    fabricante.disabled =
        fabricantes.length === 0;

}


/* =========================================
   CARREGAR MODELOS
========================================= */

async function carregarModelosEquipamentos() {

    const tipo =
        document.getElementById(
            "equipamento_tipo"
        ).value;

    const fabricante =
        document.getElementById(
            "equipamento_fabricante"
        ).value;

    const modelo =
        document.getElementById(
            "equipamento_modelo"
        );


    modelo.innerHTML =
        '<option value="">Carregando...</option>';

    modelo.disabled = true;


    if (!tipo || !fabricante) {

        modelo.innerHTML =
            '<option value="">Selecione o fabricante</option>';

        return;
    }


    const {
        data,
        error
    } = await supabaseClient

        .from("equipamentos")

        .select(`
            id,
            modelo
        `)

        .eq(
            "tipo",
            tipo
        )

        .eq(
            "fabricante",
            fabricante
        )

        .eq(
            "situacao",
            "Ativo"
        )

        .order(
            "modelo",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar modelos:",
            error
        );

        modelo.innerHTML =
            '<option value="">Erro ao carregar</option>';

        return;
    }


    modelo.innerHTML =
        '<option value="">Selecione o modelo</option>';


    (data || []).forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                item.id;

            option.textContent =
                item.modelo;

            modelo.appendChild(
                option
            );

        }
    );


    modelo.disabled =
        !data ||
        data.length === 0;

}

========================================= */

async function carregarDadosEquipamento() {

    const id =
        document.getElementById(
            "equipamento_modelo"
        ).value;


    const caixa =
        document.getElementById(
            "dadosEquipamento"
        );

    const texto =
        document.getElementById(
            "dadosEquipamentoTexto"
        );


    caixa.style.display =
        "none";


    if (!id) {

        return;

    }


    const {
        data,
        error
    } = await supabaseClient

        .from("equipamentos")

        .select("*")

        .eq(
            "id",
            id
        )

        .maybeSingle();


    if (error) {

        console.error(
            "Erro ao carregar equipamento:",
            error
        );

        return;
    }


    if (!data) {

        return;

    }


    let html = "";


    if (data.fabricante) {

        html +=
            "<strong>Fabricante:</strong> " +
            data.fabricante +
            "<br>";

    }


    if (data.modelo) {

        html +=
            "<strong>Modelo:</strong> " +
            data.modelo +
            "<br>";

    }


    if (
        data.potencia_w !== null &&
        data.potencia_w !== undefined
    ) {

        html +=
            "<strong>Potência:</strong> " +
            data.potencia_w +
            " W<br>";

    }


    if (
        data.potencia_nominal_kw !== null &&
        data.potencia_nominal_kw !== undefined
    ) {

        html +=
            "<strong>Potência nominal:</strong> " +
            data.potencia_nominal_kw +
            " kW<br>";

    }


    if (
        data.eficiencia_percentual !== null &&
        data.eficiencia_percentual !== undefined
    ) {

        html +=
            "<strong>Eficiência:</strong> " +
            data.eficiencia_percentual +
            "%<br>";

    }


    if (
        data.tensao_maxima_v !== null &&
        data.tensao_maxima_v !== undefined
    ) {

        html +=
            "<strong>Tensão máxima:</strong> " +
            data.tensao_maxima_v +
            " V<br>";

    }


    if (
        data.tensao_cc_maxima_v !== null &&
        data.tensao_cc_maxima_v !== undefined
    ) {

        html +=
            "<strong>Tensão CC máxima:</strong> " +
            data.tensao_cc_maxima_v +
            " V<br>";

    }


    if (data.registro_inmetro) {

        html +=
            "<strong>Registro Inmetro:</strong> " +
            data.registro_inmetro +
            "<br>";

    }


    if (data.situacao) {

        html +=
            "<strong>Situação:</strong> " +
            data.situacao +
            "<br>";

    }


    if (!html) {

        html =
            "Nenhum dado técnico disponível.";

    }


    texto.innerHTML =
        html;

    caixa.style.display =
        "block";

			}
