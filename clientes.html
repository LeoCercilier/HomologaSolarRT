<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<title>Clientes - HomologaSolar RT</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

header {
  background: #0f766e;
  color: white;
  padding: 18px;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.topo h2 {
  margin: 0;
}

button {
  border: none;
  border-radius: 9px;
  padding: 12px 15px;
  font-weight: bold;
  cursor: pointer;
}

.btn-principal {
  background: #0f766e;
  color: white;
}

.btn-secundario {
  background: #e2e8f0;
  color: #334155;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.busca {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 15px;
}

.lista {
  display: grid;
  gap: 12px;
}

.cliente {
  background: white;
  padding: 16px;
  border-radius: 13px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
  cursor: pointer;
  transition: .2s;
}

.cliente:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 16px rgba(0,0,0,.09);
}

.cliente strong {
  display: block;
  font-size: 17px;
  margin-bottom: 6px;
}

.cliente span {
  display: block;
  color: #64748b;
  font-size: 13px;
  margin-top: 3px;
}

.vazio {
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 13px;
  color: #64748b;
}

.erro {
  display: none;
  background: #fee2e2;
  color: #991b1b;
  padding: 14px;
  border-radius: 9px;
  margin-bottom: 15px;
}

.sucesso {
  display: none;
  background: #dcfce7;
  color: #166534;
  padding: 14px;
  border-radius: 9px;
  margin-bottom: 15px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  padding: 15px;
  overflow-y: auto;
  z-index: 1000;
}

.modal-conteudo {
  background: white;
  max-width: 600px;
  margin: 30px auto;
  border-radius: 15px;
  padding: 20px;
}

.modal-conteudo h2 {
  margin-top: 0;
}

.campo {
  margin-bottom: 12px;
}

.campo label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
}

.campo input {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
}

.linha {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.acoes {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.acoes button {
  flex: 1;
}

.carregando {
  text-align: center;
  padding: 30px;
  color: #64748b;
}


/* =========================================
   MODAL DETALHES DO CLIENTE
========================================= */

.modal-detalhes {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  padding: 15px;
  overflow-y: auto;
  z-index: 2000;
}

.modal-detalhes-conteudo {
  background: white;
  max-width: 600px;
  margin: 30px auto;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.modal-detalhes-conteudo h2 {
  margin-top: 0;
  margin-bottom: 20px;
  color: #0f766e;
}

.detalhe-item {
  padding: 11px 0;
  border-bottom: 1px solid #e5e7eb;
}

.detalhe-item:last-child {
  border-bottom: none;
}

.detalhe-label {
  display: block;
  font-size: 12px;
  color: #64748b;
  font-weight: bold;
  margin-bottom: 4px;
}

.detalhe-valor {
  display: block;
  font-size: 15px;
  color: #1f2937;
}

.acoes-detalhes {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.acoes-detalhes button {
  flex: 1;
}

.btn-excluir {
  background: #dc2626;
  color: white;
}


@media (max-width: 600px) {

  .topo {
    align-items: stretch;
    flex-direction: column;
  }

  .linha {
    grid-template-columns: 1fr;
  }

  .acoes-detalhes {
    flex-direction: column;
  }

}

</style>

</head>


<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioAtual = null;
let organizacaoAtual = null;
let clientes = [];
let clienteEditando = null;

/* =========================================
   INICIALIZAÇÃO
========================================= */

async function iniciar() {

  try {

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "login.html";

      return;

    }


    usuarioAtual =
      data.user;


    /* =====================================
       DESCOBRIR ORGANIZAÇÃO
    ===================================== */

    const {
      data: membro,
      error: erroMembro
    } =
    await supabaseClient
      .from("organizacao_membros")
      .select(`
        organizacao_id
      `)
      .eq(
        "usuario_id",
        usuarioAtual.id
      )
      .eq(
        "ativo",
        true
      )
      .limit(1)
      .maybeSingle();


    if (erroMembro)
      throw erroMembro;


    if (!membro) {

      throw new Error(
        "Usuário sem organização."
      );

    }


    organizacaoAtual =
      membro.organizacao_id;


    await carregarClientes();

  }

  catch (erro) {

    mostrarErro(
      erro.message
    );

  }

}


/* =========================================
   CARREGAR CLIENTES
========================================= */

async function carregarClientes() {

  const {
    data,
    error
  } =
  await supabaseClient
    .from("clientes")
    .select(`
      id,
      nome,
      cpf_cnpj,
      email,
      telefone,
      endereco,
      numero,
      complemento,
      bairro,
      cidade,
      estado,
      cep
    `)
    .eq(
      "organizacao_id",
      organizacaoAtual
    )
    .order(
      "nome",
      {
        ascending: true
      }
    );


  if (error)
    throw error;


  clientes =
    data || [];


  renderizarClientes(
    clientes
  );

}


/* =========================================
   MOSTRAR CLIENTES
========================================= */

function renderizarClientes(lista) {

  const elemento =
    document.getElementById(
      "lista"
    );


  if (
    !lista ||
    lista.length === 0
  ) {

    elemento.innerHTML = `
      <div class="vazio">
        Nenhum cliente cadastrado.
      </div>
    `;

    return;

  }


  elemento.innerHTML = "";


  lista.forEach(cliente => {

    const div =
      document.createElement("div");


    div.className =
      "cliente";


    div.innerHTML = `
      <strong>
        ${escaparHtml(cliente.nome)}
      </strong>

      ${
        cliente.cpf_cnpj
        ? `<span>CPF/CNPJ: ${escaparHtml(cliente.cpf_cnpj)}</span>`
        : ""
      }

      ${
        cliente.telefone
        ? `<span>Telefone: ${escaparHtml(cliente.telefone)}</span>`
        : ""
      }

      ${
        cliente.cidade
        ? `<span>
            ${escaparHtml(cliente.cidade)}
            ${
              cliente.estado
              ? " - " + escaparHtml(cliente.estado)
              : ""
            }
          </span>`
        : ""
      }

      <span style="
        margin-top:10px;
        color:#0f766e;
        font-weight:bold;
      ">
        👁️ Ver detalhes
      </span>
    `;


    /*
     * Clicar no cartão abre os detalhes
     */

    div.onclick =
      function() {

        abrirDetalhesCliente(
          cliente
        );

      };


    /*
     * Botão excluir continua separado
     */

    const botaoExcluir =
      document.createElement("button");


    botaoExcluir.textContent =
      "🗑️ Excluir";


    botaoExcluir.style.marginTop =
      "10px";


    botaoExcluir.style.background =
      "#dc2626";


    botaoExcluir.style.color =
      "white";


    botaoExcluir.onclick =
      function(event) {

        /*
         * Impede que o clique no botão
         * também abra o modal
         */

        event.stopPropagation();


        excluirCliente(
          cliente.id
        );

      };


    div.appendChild(
      botaoExcluir
    );


    elemento.appendChild(
      div
    );

  });

}


/* =========================================
   BUSCA
========================================= */

function filtrarClientes() {

  const termo =
    document
      .getElementById("busca")
      .value
      .toLowerCase()
      .trim();


  const filtrados =
    clientes.filter(cliente => {

      return (

        (cliente.nome || "")
          .toLowerCase()
          .includes(termo)

        ||

        (cliente.cpf_cnpj || "")
          .toLowerCase()
          .includes(termo)

        ||

        (cliente.telefone || "")
          .toLowerCase()
          .includes(termo)

      );

    });


  renderizarClientes(
    filtrados
  );

}


/* =========================================
   MODAL NOVO CLIENTE
========================================= */

function abrirModal() {

  clienteEditando = null;

  document.getElementById(
    "tituloModalCliente"
  ).textContent =
    "Novo cliente";

  document.getElementById(
    "textoBotaoSalvar"
  ).textContent =
    "Salvar cliente";

  document.getElementById(
    "formCliente"
  ).reset();

  document.getElementById(
    "modal"
  ).style.display =
    "block";

}


function fecharModal() {

  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "formCliente"
  ).reset();

}

	function editarCliente(cliente) {

  clienteEditando = cliente;

  document.getElementById(
    "tituloModalCliente"
  ).textContent =
    "Editar cliente";

  document.getElementById(
    "textoBotaoSalvar"
  ).textContent =
    "Salvar alterações";


  document.getElementById("nome").value =
    cliente.nome || "";

  document.getElementById("cpf_cnpj").value =
    cliente.cpf_cnpj || "";

  document.getElementById("telefone").value =
    cliente.telefone || "";

  document.getElementById("email").value =
    cliente.email || "";

  document.getElementById("endereco").value =
    cliente.endereco || "";

  document.getElementById("numero").value =
    cliente.numero || "";

  document.getElementById("complemento").value =
    cliente.complemento || "";

  document.getElementById("bairro").value =
    cliente.bairro || "";

  document.getElementById("cidade").value =
    cliente.cidade || "";

  document.getElementById("estado").value =
    cliente.estado || "";

  document.getElementById("cep").value =
    cliente.cep || "";


  fecharDetalhesCliente();

  document.getElementById(
    "modal"
  ).style.display =
    "block";

	}


/* =========================================
   MODAL DETALHES DO CLIENTE
========================================= */

function abrirDetalhesCliente(
  cliente
) {

  document.getElementById(
    "tituloDetalhesCliente"
  ).textContent =
    "👤 " + cliente.nome;


  const dados =
    document.getElementById(
      "dadosDetalhesCliente"
    );


  dados.innerHTML = `

    <div class="detalhe-item">

      <span class="detalhe-label">
        Nome
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.nome)}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        CPF/CNPJ
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.cpf_cnpj || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        Telefone
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.telefone || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        E-mail
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.email || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        Endereço
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.endereco || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        Número
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.numero || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        Complemento
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.complemento || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        Bairro
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.bairro || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        Cidade
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.cidade || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        Estado
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.estado || "Não informado")}
      </span>

    </div>


    <div class="detalhe-item">

      <span class="detalhe-label">
        CEP
      </span>

      <span class="detalhe-valor">
        ${escaparHtml(cliente.cep || "Não informado")}
      </span>

    </div>

  `;

const botaoEditar =
  document.getElementById(
    "btnEditarDetalhes"
  );

botaoEditar.onclick =
  function() {

    editarCliente(cliente);

  };
	
  /*
   * Configura o botão excluir
   * para o cliente atualmente aberto
   */

  const botaoExcluir =
    document.getElementById(
      "btnExcluirDetalhes"
    );


  botaoExcluir.onclick =
    function() {

      fecharDetalhesCliente();

      excluirCliente(
        cliente.id
      );

    };


  document.getElementById(
    "modalDetalhesCliente"
  ).style.display =
    "block";

}


function fecharDetalhesCliente() {

  document.getElementById(
    "modalDetalhesCliente"
  ).style.display =
    "none";

}


/* =========================================
   SALVAR CLIENTE
========================================= */

document
  .getElementById("formCliente")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const botao =
        document.getElementById(
          "btnSalvar"
        );


      botao.disabled = true;


      botao.textContent =
        "Salvando...";


      try {

        let erro;

const dadosCliente = {

  organizacao_id:
    organizacaoAtual,

  nome:
    document
      .getElementById("nome")
      .value
      .trim(),

  cpf_cnpj:
    document
      .getElementById("cpf_cnpj")
      .value
      .trim() || null,

  email:
    document
      .getElementById("email")
      .value
      .trim() || null,

  telefone:
    document
      .getElementById("telefone")
      .value
      .trim() || null,

  endereco:
    document
      .getElementById("endereco")
      .value
      .trim() || null,

  numero:
    document
      .getElementById("numero")
      .value
      .trim() || null,

  complemento:
    document
      .getElementById("complemento")
      .value
      .trim() || null,

  bairro:
    document
      .getElementById("bairro")
      .value
      .trim() || null,

  cidade:
    document
      .getElementById("cidade")
      .value
      .trim() || null,

  estado:
    document
      .getElementById("estado")
      .value
      .trim()
      .toUpperCase() || null,

  cep:
    document
      .getElementById("cep")
      .value
      .trim() || null
};


if (clienteEditando) {

  const resultado =
    await supabaseClient
      .from("clientes")
      .update(dadosCliente)
      .eq(
        "id",
        clienteEditando.id
      )
      .eq(
        "organizacao_id",
        organizacaoAtual);

  erro = resultado.error;

} else {

  dadosCliente.criado_por =
    usuarioAtual.id;

  const resultado =
    await supabaseClient
      .from("clientes")
      .insert(dadosCliente);

  erro = resultado.error;

}


if (erro)
  throw erro;

        
    


        if (error)
          throw error;


        fecharModal();


        mostrarSucesso(
          "Cliente cadastrado com sucesso!"
        );


        await carregarClientes();

      }

      catch (erro) {

        mostrarErro(
          erro.message
        );

      }

      finally {

        botao.disabled =
          false;


        botao.textContent =
          "Salvar cliente";

      }

    }
  );


/* =========================================
   MENSAGENS
========================================= */

function mostrarErro(
  mensagem
) {

  const elemento =
    document.getElementById(
      "erro"
    );


  elemento.textContent =
    "ERRO: " + mensagem;


  elemento.style.display =
    "block";


  setTimeout(() => {

    elemento.style.display =
      "none";

  }, 6000);

}


function mostrarSucesso(
  mensagem
) {

  const elemento =
    document.getElementById(
      "sucesso"
    );


  elemento.textContent =
    mensagem;


  elemento.style.display =
    "block";


  setTimeout(() => {

    elemento.style.display =
      "none";

  }, 4000);

}


/* =========================================
   ESCAPAR HTML
========================================= */

function escaparHtml(
  texto
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    texto || "";


  return div.innerHTML;

}


/* =========================================
   EXCLUIR CLIENTE
========================================= */

async function excluirCliente(
  id
) {

  const confirmar =
    confirm(
      "Tem certeza que deseja excluir este cliente?"
    );


  if (!confirmar) {

    return;

  }


  try {

    const {
      error
    } =
    await supabaseClient
      .from("clientes")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "organizacao_id",
        organizacaoAtual
      );


    if (error)
      throw error;


    alert(
      "Cliente excluído com sucesso!"
    );


    await carregarClientes();

  }

  catch (erro) {

    console.error(
      erro
    );


    alert(
      "Erro ao excluir cliente: " +
      erro.message
    );

  }

}

   INICIAR
========================================= */

iniciar();
