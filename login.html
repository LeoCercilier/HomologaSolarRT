<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
	<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">

  <title>HomologaSolar RT</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 24px 18px;
    }

    .logo {
      text-align: center;
      margin-top: 50px;
      margin-bottom: 35px;
    }

    .logo h1 {
      margin: 0;
      font-size: 28px;
      color: #0f766e;
    }

    .logo p {
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .campo input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    .campo input:focus {
      border-color: #0f766e;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-entrar {
      background: #0f766e;
      color: white;
    }

    .btn-cadastro {
      margin-top: 12px;
      background: #e2e8f0;
      color: #334155;
    }

    .mensagem {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .rodape {
      text-align: center;
      margin-top: 25px;
      color: #94a3b8;
      font-size: 12px;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="logo">

      <a href="index.html" style="text-decoration:none;color:inherit;">
        <h1>☀️ HomologaSolar RT</h1>
      </a>

      <p>
        Gestão inteligente de projetos fotovoltaicos
      </p>

    </div>


    <div class="card">

      <div class="campo">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="seu@email.com"
        >

      </div>


      <div class="campo">

        <label for="senha">
          Senha
        </label>

        <input
          type="password"
          id="senha"
          placeholder="Sua senha"
        >

      </div>  


				<button  
					class="btn-entrar"  
					onclick="entrar()"  
				>  
					Entrar  
				</button>  


				<button  
					class="btn-cadastro"  
					onclick="cadastrar()"  
				>  
					Criar minha conta  
				</button>  

		<button
  id="btnInstalarApp"
  style="
    margin-top:12px;
    background:#ffffff;
    color:#0f766e;
    border:2px solid #0f766e;
  "
>
  📲 Instalar HomologaSolar RT
		</button>


				<div  
					id="mensagem"  
					class="mensagem"  
				></div>  

			</div>  


			<div class="rodape">
        <a href="index.html" style="color:#64748b;text-decoration:none;font-size:13px;">← Voltar para a página inicial</a>
        <br><br>
				HomologaSolar RT © 2026  
    </div>

  </div>


  <!-- Biblioteca oficial do Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Nossas configurações -->

  <script src="supabase-config.js"></script>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function mostrarMensagem(texto) {

      document.getElementById(
        "mensagem"
      ).textContent = texto;

    }


    async function cadastrar() {

      const email =
        document.getElementById("email").value.trim();

      const senha =
        document.getElementById("senha").value;


      if (!email || !senha) {

        mostrarMensagem(
          "Preencha e-mail e senha."
        );

        return;
      }


      if (senha.length < 6) {

        mostrarMensagem(
          "A senha precisa ter pelo menos 6 caracteres."
        );

        return;
      }


      mostrarMensagem(
        "Criando sua conta..."
      );


      const { data, error } =
  await supabaseClient.auth.signUp({
    email: email,
    password: senha,
    options: {
      emailRedirectTo:
        window.location.origin +
        window.location.pathname
    }
  });


      if (error) {

        console.error(error);

        mostrarMensagem(
          error.message
        );

        return;
      }


      console.log(data);


      mostrarMensagem(
        "Conta criada! Verifique seu e-mail para confirmar."
      );

    }


    async function entrar() {

      const email =
        document.getElementById("email").value.trim();

      const senha =
        document.getElementById("senha").value;


      if (!email || !senha) {

        mostrarMensagem(
          "Preencha e-mail e senha."
        );

        return;
      }


      mostrarMensagem(
        "Entrando..."
      );


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: senha

        });


      if (error) {

        console.error(error);

        mostrarMensagem(
          error.message
        );

        return;
      }


      console.log(data);


      mostrarMensagem(
  "Login realizado com sucesso!"
);

setTimeout(() => {
  window.location.href = "dashboard.html";
}, 500);
    }

	  let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", function(event) {

  event.preventDefault();

  deferredPrompt = event;

});


document.getElementById("btnInstalarApp").addEventListener("click", async function() {

  if (deferredPrompt) {

    deferredPrompt.prompt();

    const resultado = await deferredPrompt.userChoice;

    console.log("Instalação:", resultado.outcome);

    deferredPrompt = null;

    return;
  }

  alert(
    "Para instalar o HomologaSolar RT, toque nos três pontinhos ⋮ do Chrome e escolha 'Instalar app' ou 'Adicionar à tela inicial'."
  );

});


window.addEventListener("appinstalled", function() {

  console.log("HomologaSolar RT instalado.");

});

  </script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
</body>

</html>
